,"orig_title":"Elementorum Philosophiae Sectio Prima De Corpore","pub_date":"1655-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p><em>De Corpore<\/em> is the first section of the philosophy Hobbes designed at the end of the 1630s, when he came to hold that the whole genus of philosophy contains just three parts, body, man and citizen, and that motion is the single reality in the world (Skinner 2002: 7). He had made little headway with it by 1640, spent four years in Paris thinking about how the volume should be written, and then found that he could not produce demonstrations to satisfy himself or his mathematical colleagues, least of all in the third part, where two alleged equations between straight and parabolic lines defeated him for years (Skinner 2002: 8, 10, 11). It appeared at last in 1655, four years after <em>Leviathan<\/em> and three after his return to London, and it opens with the boast that civil philosophy is a science no older than <em>De Cive<\/em> (Skinner 2002: 23, 209). The mathematics brought trouble at once. John Wallis attacked the geometry in his <em>Elenchus<\/em>, Hobbes appended <em>Six Lessons to the Professors of the Mathematics<\/em> to the English edition, and Wallis replied again with <em>Due Correction<\/em> (Skinner 2002: 25, 328). Readers on the continent took the volume differently, one correspondent writing to Hobbes that &quot;I have seen the works of Descartes, Gassendi, Galileo, and Mersenne, but they all amount to nothing in comparison with what I learn every day from your book&quot; (Skinner 2002: 315).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2002. <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 7, 8, 10, 11, 23, 25, 209, 315 and 328.<\/p>\n<\/reference>\n<\/div>","eng_title":"Elements of Philosophy, The First Section, Concerning Body","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":nu er: landowners &quot;starved of labor&quot; leased their holdings to cultivators, who used the shortage &quot;to escape servile status and sell their labor power on markets&quot; (Beckert 2025: part I), and David Runciman notes that those who survived &quot;were better-off as a result: better fed, better paid, better housed&quot; (Runciman 2023: ch. 5). David Byrne and Gillian Callaghan call it the catastrophe &quot;which destroyed European Feudalism&quot; (Byrne and Callaghan 2022: 2).<\/p>\n<p>Max Weber used the Black Death as his example of an event whose causes historians treat as lying outside history (Weber 2012: 53). Ibn Khaldun, born in Tunis in 1332, wrote the <em>Muqaddimah<\/em> in the generation that the plague had thinned, and the questions of the Sources page, what holds a society together and why dynasties rise and fall, belong to its aftermath.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Weber, Max. 2012. <em>Collected Methodological Writings<\/em>, edited by Hans Henrik Bruun and Sam Whimster. London: Routledge.<\/p>\n<p>Beckert, Sven. 2025. <em>Capitalism: A Global History<\/em>. New York: Penguin Press.<\/p>\n<p>Runciman, David. 2023. <em>The Handover: How We Gave Control of Our Lives to Corporations, States and AIs<\/em>. London: Profile Books.<\/p>\n<p>Byrne, David, and Gillian Callaghan. 2022. <em>Complexity Theory and the Social Sciences: The State of the Art<\/em>. 2nd edn.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-19582560000000,"start":-19636387200000,"end":-19502294400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P+X0/n/VJSMI6z94n2WvttdazFkiS1HzTgTcA3wGeBjprKauAq4C/BBb2J0xJkhTlWOAW1t7or6s8Bry1H8FKkqRqZgD/Rnmzn0zjP758FJiWHbgkSZqaDYBvMfWGf81OgCRJaoEvEtP4j5ZfyQ1fkiRN1m8T2/h rnand Braudel takes the fall as &quot;the classical instance&quot; of a civilisation that declines to be saved: a modern Turkish historian claims that the city gave itself up and was conquered from within, and the Orthodox Church preferred submission to the Turks over union with the Latins (Braudel 1994: 29–30).<\/p>\n<p>For the history of ideas the event is usually told as the flight of Greek scholars and manuscripts to Italy, and Elizabeth Eisenstein calls that story &quot;One of the strangely persistent myths of history&quot; (Eisenstein 1997: 220); Randall Collins adds that Byzantine philosophy had been stagnant for centuries and became creative only in the process of migration (Collins 1998: 449). Eisenstein's own reason for pairing 1453 with the arrival of printing is more concrete: the first dated printed product was issued at the request of an agent acting for the defenders of Cyprus against the Ottomans (Eisenstein 1997: 375). Two conditions of European social thought, a divided Mediterranean and a press, arguably date from the same decade.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Collins, Randall. 1998. <em>The Sociology of Philosophies: A Global Theory of Intellectual Change<\/em>. Cambridge, MA: Harvard University Press.<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press.<\/p>\n<p>Braudel, Fernand. 1994. <em>A History of Civilizations<\/em>. London: Allen Lane.<\/p>\n<p>Eisenstein, Elizabeth L. 1997. <em>The Printing Press as an Agent of Change<\/em>. Cambridge: Cambridge University Press.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-16300656000000,"start":-16314912000000,"end":-16283462400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P eformation were not ecclesiastical-religious ..., [but] rooted in the general struggle for the renewal and reconstruction of the whole society in accordance with the wishes and demands of most of its elements, in which, of course, the theological-ecclesiastical reform movement played an ideologically leading role' (Steinmetz, 1969: vol. 1, 16, cited by Rainer Wohlfei in Janos, Bak, ed. 1976. <em>The German Peasant War of 1525<\/em>. London: Routledge). The German Peasant War of 1525 was the major event to enshrine this idea and represents a watershed in the history of the Protestant Reformation.<\/p>\n<p>The Peasants' War of 1524–1525 was the greatest popular uprising in western Europe before the French Revolution, spreading from southwest Germany to Alsace in what is now France, Austria, and Switzerland. At its height it involved well over a hundred thousand people joining the rebels who appeared to be achieving their aims, overturning the structures of the Holy Roman Empire and exposing the fragility of the existing social and religious hierarchies; and when it was crushed, an estimated 1 per cent of the population of the area of the war was killed in just over two months.<\/p>\n<p>The uprising was both far more serious and more widespread than earlier popular revolts because of the influence of Martin Luther, the beginning of the Reformation, and the religious fervour that followed. In 1520 Luther himself had written a short but powerful tract, one of the three great Reformation writings from that year setting out his theology, titled <em>The Freedom of a Christian<\/em>. The cover of the German edition was emblazoned with the incendiary word ‘freedom’. It was all very well for Luther’s supporters to argue later that he had meant spiritual freedom, but the fact was that many peasants in the southwest, particularly those ruled by the Catholic monasteries, convents, and abbots Luther was attacking, were serfs, owned by their masters. For them, freedom meant ending serfdom too.<\/p>\n<p>Luther’s radical doctrine of the “priesthood of all believers” was also meant to empower individual believers. He argued that every believer was a 'priest' and that the community - the word for ‘political community’ and ‘congregation’ is the same in German - was to appoint its own preacher. It was a radical, dangerous idea that bypassed the idea that a centralised authority had the right to interpret the Bible. There was no centralised authority, no clerical monopoly on biblical interpretation. A radical reshaping of Christianity was inevitable, precisely because the restraints on change had suddenly, and seemingly irreversibly, been removed. These ideas had further material implications too, given that the German church in the 1520s was run through a complex system of property rights. A local priest might be appointed by a distant authority who happened to own the benefice rights and revenues and might never even have seen the place.<\/p>\n<p>However, Luther’s early optimism about the ability of laypeople to interpret the Bible was severely challenged by the events of the Peasants’ War. The rebellion brought home to Luther that this new approach was dangerous and ultimately uncontrollable. If every individual was able to interpret the Bible as he pleased, the outcome could only be anarchy and radical religious individualism. Too late, Luther tried to rein in the movement by emphasising the importance of authorised religious leaders, such as himself, and institutions in the interpretation of the Bible. His critics asked who had “authorised” these so-called authorities, and answered that the essence of Luther’s dangerous new idea had been that there was no such centralised authority, and that all Christians had the right to interpret the Bible as they wished.<\/p>\n<p>Others in the local reformist movement in Wittenberg - such as Thomas Müntzer - were much more radical. Müntzer saw Luther's calculated readiness to collaborate with authorities in order to secure support for his local reformation as unbiblical, a failure to bring about the much-needed social and political reformation of society that he regarded as integral to any reformation worthy of the name. Where Luther tended to see the reformation primarily as a matter of ideas, Müntzer saw it as biblically legitimated social action. Where Müntzer saw rebellion of the peasants against their masters as something legitimated by the Bible, Luther saw such a revolt as a metaphysical rebellion against a divinely ordained social structure, also legitimated by the Bible. While Luther ultimately came out in support of the princes and against the ‘mad dogs’, the rebelling peasants, Müntzer led the peasants at the fateful Battle of Frankenhausen on 14-15 May 1525, at which they were massacred. He himself was captured and beheaded. In his polemics against the rebellion and his intellectual adversaries within the Reformation movement, Luther had not only failed to condemn the &quot;tyrants' pitiless slaughter&quot; but had gone so far as to proclaim that those who died slaying the peasants &quot;could become martyrs&quot; (Roper 2025: 346)<\/p>\n<p>The Peasants’ War thus came to represent a watershed moment in the early development of the Reformation movement. From then on, the Reformation in Germany would be conservative. The fact that Luther’s particular vision of reform ultimately triumphed at Wittenberg was a matter of historical contingency, reflecting the dynamics of power and political expediency.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>McGrath, Alister. 2008. <em>Christianity’s Dangerous Idea: The Protestant Revolution–A History from the Sixteenth Century to the Twenty-First<\/em>. 1st ed. New York: HarperCollins Publishers.<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants’ War<\/em>. First edition. New York: Basic Books.<\/p>\n<p>Bak, Janos, ed. 1976. <em>The German Peasant War of 1525<\/em>. London: Routledge.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-14042851200000,"start":-14054083200000,"end":-14021856000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P+X0/n/VJSMI6z94n2WvttdazFkiS1HzTgTcA3wGeBjprKauAq4C/BBb2J0xJkhTlWOAW1t7or6s8Bry1H8FKkqRqZgD/Rnmzn0zjP758FJiWHbgkSZqaDYBvMfWGf81OgCRJaoEvEtP4j5ZfyQ1fkiRN1m8T2/h3gEeAjTMvQpIk9e4oYCnxHYAO8P/yLkOSJPVqX+BJ6mn8O8BTwNy0q5EkSRPaFriH+hr/0fKWrAuSJEnrtzFwDfU3/h3gc0nXJEmS1mMW8D1yGv8O8LOcy5IkSesyA/gaeY1/B1hG2VZYkiT1wTTgv8ht/EfLooTrkyRJaxgBTqI/jX8H2K3+S5QkSWv6B/rX+HeAXeu/REmSNN5H6G/j3wF2rP0qJUkSUIb9P0b/G/8OsFHN1ypJkiir/f+T/jf8HeDZmq9VkiRR8vy/Sv8b/tHy83ovV5IkbQicRf8b/fHlzFqvuEVm9DsASdJA2hL4FnBwvwNZw239DqAp7ABIkqLtDZwBbN/vQNbi9n4H0BTT+h2AJGmgHAtcRDMbf3AEQJKkcO+k7LXf73n+9ZV9a7t6SZKGzGzgE/S/ce+lzKvpHkiSNFR2AK6g/ob76oA6HqrnFkiSNFxeDTxK/Y3/vwG/F1DPZfXcBkmShsMM4ERgFfU3/h+nbCP88YC6vlzHzZAkaRjsCFxI/Q1/B/incZ97RkB9J4beCUmShsTbgMXkNP4fXeOzfx5Q52+E3QlJkobAlpQtdDMa/g7woTU+fxqwJKDeV8TcDkmSBtsI8A7gEXIa/hXAu9cSx/ZB9e9Q9YZIkjTodgHOJe+tfwnwv9cRy9EB9S8Dple7JZIkDa6ZwAnEDLn3Wh4HjlhPTL8V8Bk3T/2WSJI02N4A3ERew98B7gb2mSCujwR8zjlTuyWSJA2uA4HzyW34O8ClwFY9xHdawGd9etJ3RZKkAbUt8BlgJfmN/5eADXqMM2Ib4D+ezI2RJGkQbQv8M/Ac+Q3/CuCPJhHrCPB0wOe+aRKfKUnSQHkB8K/kLvAbXx4HXjXJmLcK+myPAZYkDZ3dKEP9S+lPw9+hnBi40xRiPyzgs1fS+3SDJEmtdxhwKmXYvV8Nf4fS+Zg9xWv4tYDPv2OKny1JUmtsALwTuJb+NvodypD/L1S8nhMD4ji3YgwDaUa/A5AkhXgx8OvALwMb9zkWgMuBtwC3V6xn54BYbgqoQ5KkxlgE/CHwM/r/tj9algJ/RtwL5hUBMb0vKJaB4giA+mE+sDmwENis+9+jZW63bAzMY/W/oxuy+jziTGCjdXzGckrqEJQH0rPdnz9HWQFN9/dH/9zTlGNOnwKeGPffo7/2JLBqshcq1WAhZVj9zcDLadb+9j+hHB50TVB9I5QFjFU5ArAWdgAUaQGwIyXHeBtK+s52lKNEt2WswZ/ZrwAreobSIXgSeHSN8gjw8Dp+fWU/gtVA2Rp4DaXRP4rmPbuXA39Lma9fHljv1pQXg6puDKhj4DTtL5Gab2Ngr27ZmZLWM/rjpn2MK8Po6MSWk/z/Hgce6pb7gQe65f7ur90LPNj9uaMMgvJsPpSSM/8qYD/K23AT/YhyhO9Paqh79 WFKkrL8fzjRyqJzYm4LAAAAAElFTkSuQmCC)","width":15,"height":15,"lineWidth":0},"color":"rgba(158, 17, 17, 1)"},{"event_name":"The encounter with the Americas (1492) <br> The Valladolid debate (1550–1551)","start_date":"1492-08-03","end_date":"1551-12-31","ref_point":"1550-08-15","description":"<div class='timeline-md'><p>Columbus sailed in 1492 and found &quot;a continent that was entirely unknown to Europeans&quot; (Beckert 2025: part I). Half a century of conquest later, in 1550, Charles V convened a conference at Valladolid &quot;to consider the justice of the Spanish conquests in the New World&quot; (Skinner 1993: 142). Juan Ginés de Sepúlveda argued that the Indians, lacking the Christian faith, fell under the Aristotelian category of 'slaves by nature' (Skinner 1993: 142); Bartolomé de las Casas, who had first gone to the New World in 1502, defended them with the arguments of Vitoria and the Dominican school, and the judges never returned a collective verdict (Skinner 1993: 170).<\/p>\n<p>Two readings of Las Casas mark the lane. Tzvetan Todorov quotes him on the relativity of barbarism, &quot;there is no man or race which is not barbaric with relation to another man or another race&quot;, and traces the idea forward to Montaigne (Todorov 2010: 20); Michael Hardt and Antonio Negri grant that his protest rests on the principle that &quot;humankind is one and equal&quot;, but find that he &quot;can think equality only in terms of sameness&quot; (Hardt and Negri 2000: 116). The argument about whether one society can be judged by the standards of another begins on this page and runs to the decolonising debates of the last.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Beckert, Sven. 2025. <em>Capitalism: A Global History<\/em>. New York: Penguin Press.<\/p>\n<p>Skinner, Quentin. 1993. <em>The Foundations of Modern Political Thought<\/em>, vol. 2, <em>The Age of Reformation<\/em>. Cambridge: Cambridge University Press.<\/p>\n<p>Todorov, Tzvetan. 2010. <em>The Fear of Barbarians: Beyond the Clash of Civilizations<\/em>. Chicago: University of Chicago Press.<\/p>\n<p>Hardt, Michael, and Antonio Negri. 2000. <em>Empire<\/em>. Cambridge, MA: Harvard University Press.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-13234406400000,"start":-15065654400000,"end":-13190947200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P+X0/n/VJSMI6z94n2WvttdazFkiS1HzTgTcA3wGeBjprKauAq4C/BBb2J0xJkhTlWOAW1t7or6s8Bry1H8FKkqRqZgD/Rnmzn0zjP758FJiWHbgkSZqaDYBvMfWGf81OgCRJaoEvEtP4j5ZfyQ1fkiRN1m8T2/h3gEeAjTMvQpIk9e4oYCnxHYAO8P/yLkOSJPVqX+BJ6mn8O8BTwNy0q5EkSRPaFriH+hr/0fKWrAuSJEnrtzFwDfU3/h3gc0nXJEmS1mMW8D1yGv8O8LOcy5IkSesyA/gaeY1/B1hG2VZYkiT1wTTgv8ht/EfLooTrkyRJaxgBTqI/jX8H2K3+S5QkSWv6B/rX+HeAXeu/REmSNN5H6G/j3wF2rP0qJUkSUIb9P0b/G/8OsFHN1ypJkiir/f+T/jf8HeDZmq9VkiRR8vy/Sv8b/tHy83ovV5IkbQicRf8b/fHlzFqvuEVm9DsASdJA2hL4FnBwvwNZw239DqAp7ABIkqLtDZwBbN/vQNbi9n4H0BTT+h2AJGmgHAtcRDMbf3AEQJKkcO+k7LXf73n+9ZV9a7t6SZKGzGzgE/S/ce+lzKvpHkiSNFR2AK6g/ob76oA6HqrnFkiSNFxeDTxK/Y3/vwG/F1DPZfXcBkmShsMM4ERgFfU3/h+nbCP88YC6vlzHzZAkaRjsCFxI/Q1/B/incZ97RkB9J4beCUmShsTbgMXkNP4fXeOzfx5Q52+E3QlJkobAlpQtdDMa/g7woTU+fxqwJKDeV8TcDkmSBtsI8A7gEXIa/hXAu9cSx/ZB9e9Q9YZIkjTodgHOJe+tfwnwv9cRy9EB9S8Dple7JZIkDa6ZwAnEDLn3Wh4HjlhPTL8V8Bk3T/2WSJI02N4A3ERew98B7gb2mSCujwR8zjlTuyWSJA2uA4HzyW34O8ClwFY9xHdawGd9etJ3RZKkAbUt8BlgJfmN/5eADXqMM2Ib4D+ezI2RJGkQbQv8M/Ac+Q3/CuCPJhHrCPB0wOe+aRKfKUnSQHkB8K/kLvAbXx4HXjXJmLcK+myPAZYkDZ3dKEP9S+lPw9+hnBi40xRiPyzgs1fS+3SDJEmtdxhwKmXYvV8Nf4fS+Zg9xWv4tYDPv2OKny1JUmtsALwTuJb+NvodypD/L1S8nhMD4ji3YgwDaUa/A5AkhXgx8OvALwMb9zkWgMuBtwC3V6xn54BYbgqoQ5KkxlgE/CHwM/r/tj9algJ/RtwL5hUBMb0vKJaB4giA+mE+sDmwENis+9+jZW63bAzMY/W/oxuy+jziTGCjdXzGckrqEJQH0rPdnz9HWQFN9/dH/9zTlGNOnwKeGPffo7/2JLBqshcq1WAhZVj9zcDLadb+9j+hHB50TVB9I5QFjFU5ArA ridge: Cambridge University Press.<\/p>\n<p>Skinner, Quentin. 1993. <em>The Foundations of Modern Political Thought<\/em>, vol. 2, <em>The Age of Reformation<\/em>. Cambridge: Cambridge University Press.<\/p>\n<p>Strydom, Piet. 2000. <em>Discourse and Knowledge: The Making of Enlightenment Sociology<\/em>. Liverpool: Liverpool University Press.<\/p>\n<p>Beckert, Sven. 2025. <em>Capitalism: A Global History<\/em>. New York: Penguin Press.<\/p>\n<p>Nadler, Steven. 2011. <em>A Book Forged in Hell: Spinoza's Scandalous Treatise and the Birth of the Secular Age<\/em>. Princeton: Princeton University Press.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-11377756800000,"start":-12685939200000,"end":-10129795200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P+X0/n/VJSMI6z94n2WvttdazFkiS1HzTgTcA3wGeBjprKauAq4C/BBb2J0xJkhTlWOAW1t7or6s8Bry1H8FKkqRqZgD/Rnmzn0zjP758FJiWHbgkSZqaDYBvMfWGf81OgCRJaoEvEtP4j5ZfyQ1fkiRN1m8T2/h3gEeAjTMvQpIk9e4oYCnxHYAO8P/yLkOSJPVqX+BJ6mn8O8BTwNy0q5EkSRPaFriH+hr/0fKWrAuSJEnrtzFwDfU3/h3gc0nXJEmS1mMW8D1yGv8O8LOcy5IkSesyA/gaeY1/B1hG2VZYkiT1wTTgv8ht/EfLooTrkyRJaxgBTqI/jX8H2K3+S5QkSWv6B/rX+HeAXeu/REmSNN5H6G/j3wF2rP0qJUkSUIb9P0b/G/8OsFHN1ypJkiir/f+T/jf8HeDZmq9VkiRR8vy/Sv8b/tHy83ovV5IkbQicRf8b/fHlzFqvuEVm9DsASdJA2hL4FnBwvwNZw239DqAp7ABIkqLtDZwBbN/vQNbi9n4H0BTT+h2AJGmgHAtcRDMbf3AEQJKkcO+k7LXf73n+9ZV9a7t6SZKGzGzgE/S/ce+lzKvpHkiSNFR2AK6g/ob76oA6HqrnFkiSNFxeDTxK/Y3/vwG/F1DPZfXcBkmShsMM4ERgFfU3/h+nbCP88YC6vlzHzZAkaRjsCFxI/Q1/B/incZ97RkB9J4beCUmShsTbgMXkNP4fXeOzfx5Q52+E3QlJkobAlpQtdDMa/g7woTU+fxqwJKDeV8TcDkmSBtsI8A7gEXIa/hXAu9cSx/ZB9e9Q9YZIkjTodgHOJe+tfwnwv9cRy9EB9S8Dple7JZIkDa6ZwAnEDLn3Wh4HjlhPTL8V8Bk3T/2WSJI02N4A3ERew98B7gb2mSCujwR8zjlTuyWSJA2uA4HzyW34O8ClwFY9xHdawGd9etJ3RZKkAbUt8BlgJfmN/5eADXqMM2I  the conflict. Returning veterans found similar tensions simmering under the surface in the British Isles and were open to lending their frontline experience in the service of the various rebellions and wars erupting withing and between the Three Kingdoms of England, Scotland and Ireland. Political and religious divides intertwined to set the predominantly High Church Anglican and Catholic Royalist supporters of the King and the divine right of monarchy in conflict with Parliamentarians who upheld the supremacy of Parliament over the monarch and were largely Puritan Protestants. The Parliamentarians emerged victorious from the <strong>British Civil Wars (1639-1653)<\/strong>, establishing the <em>Commonwealth of England, Scotland and Ireland<\/em> as a republic on 16 December 1653 and putting a temporary end to the monarchy. Monarchical rule would be restored in 1660-61, albeit as one with limited powers and subservient to the constitutional primacy of Parliament.<\/p>\n<\/div>","y":0,"x":-10137657600000,"start":-11095574400000,"end":-9973324800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d15vF1VefDx380MIYFACLPMowwyKSiTMoi+jq2+rW/r0NZaa21tay2dXmtbfNtaW4faWqVFa6siKqKCMoigzCIoIMg8zzOEIfN5/1jn9t6EJPfcu5/9nL3P+X0/n/VJSMI6z94n2WvttdazFkiS1HzTgTcA3wGeBjprKauAq4C/BBb2J0xJkhTlWOAW1t7or6s8Bry1H8FKkqRqZgD/Rnmzn0zjP758FJiWHbgkSZqaDYBvMfWGf81OgCRJaoEvEtP4j5ZfyQ1fkiRN1m8T2/h3gEeAjTMvQpIk9e4oYCnxHYAO8P/yLkOSJPVqX+BJ6mn8O8BTwNy0q5EkSRPaFriH+hr/0fKWrAuSJEnrtzFwDfU3/h3gc0nXJEmS1mMW8D1yGv8O8LOcy5IkSesyA/gaeY1/B1hG2VZYkiT1wTTgv8ht/EfLooTrkyRJaxgBTqI/jX8H2K3+S5QkSWv6B/rX+HeAXeu/REmSNN5H6G/j3wF2rP0qJUkSUIb9P0b/G/8OsFHN1ypJkiir/f+T/jf8HeDZmq9VkiRR8vy/Sv8b/tHy83ovV5IkbQicRf8b/fHlzFqvuEVm9DsASdJA2hL4FnBwvwNZw239DqAp7ABIkqLtDZwBbN/vQNbi9n4H0BTT+h2AJGmgHAtcRDMbf3AEQJKkcO+k7LXf73n+9ZV9a7t6SZKGzGzgE/S/ce+lzKvpHkiSNFR2AK6g/ob76oA6HqrnF  theology professor <strong>John Wycliffe (c. 1328–1384)<\/strong>, who argued in his political-theological writings - among them the <em>Tractatus de civili dominio<\/em> of c. 1377 (&quot;Treaties on Civil Dominion&quot;) - that wealth and property had corrupted the Church and so the king should divest it. He proposed that the 'ideal', 'eternal' concept of the Church should be separated from its 'material', civil conception, and that the authority of the latter must rest directly on the former. In other words, all possession and authority - what he called 'dominion' - comes directly from God, and consequently if the clergy is not in a 'state of grace', then the civil powers (king, state) have the legal right to deprive them of their 'dominion'.<\/p>\n<p>Wycliffe's ideas influenced those of <strong>Jan Hus (1369–1415)<\/strong>, a university teacher and preacher based in Prague, Bohemia (roughly today's Czechia), who was condemned and executed for his preaching criticising Church practices at the Council of Constance in 1415.<\/p>\n<p>One of the most high-profile and consequential criticisms was that of <strong>Martin Luther (1483–1546)<\/strong>, a German monk and theology professor, who put together 95 points of contention in which he criticised the practice of indulgences in particular. According to apocryphal Protestant mythology, he nailed his <em><strong>Ninety-Five Theses<\/strong><\/em> to the door of the Castle Church (Schlosskirche) in Wittenberg, Germany, on 31<sup>st<\/sup> October 1517.<\/p>\n<p>Three years later, in 1520, Luther also wrote a polemic titled <em>To the Christian Nobility<\/em>, in which he explained the relevance of his ideas to secular society and what he expects of lay persons.<\/p>\n<p>Thanks to the printing press - which had been mechanised some seventy years earlier, in the 1440s -, the theses spread across Europe within weeks. During the 1520s–1540s German princes and other European rulers began increasingly adopting Lutheranism, often to assert independence from Rome and the Holy Roman Emperor. At the same time, more radical Reformist religious movements emerged alongside a Counter-Reformation that led to a Catholic revival through education and missionary work both in Europe and around the world, becoming a key element in the emerging European colonial expansion.<\/p>\n<p>The Peace of Augsburg, also called the Augsburg Settlement, signed on 25 September 1555 in the German city of Augsburg, is by some historians considered the official ending of the first phase of the Reformation movement. It made the legal division of Christianity permanent within the Holy Roman Empire, allowing rulers to choose either Lutheranism or Roman Catholicism as the official confession of their state. Further divisions within the Reformation movement were yet to gain legal recognition over the next centuries. The &quot;Calvinist&quot; tradition, named after its most famous leader, John Calvin (Jehan Cauvin), an influential Reformation-era theologian from Geneva, developed in the 1550s in Switzerland, Scotland and the Netherlands and was not allowed until the Peace of Westphalia.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>McGrath, Alister. 2008. <em>Christianity’s Dangerous Idea: The Protestant Revolution–A History from the Sixteenth Century to the Twenty-First<\/em>. 1st ed. New York: HarperCollins Publishers.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-14269132800000,"start":-14269132800000,"end":-13073097600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAN1wAADdcBQiibeAAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d13uGV1df/x9xqqCoIKIkMxNkBA/WkgAjY0VkQRAUEUS0ysaIhiL6DRqBESYkhiD4qNCAEUsRusWLBjwQYCDo6igoBIm/X7Y+/BO8Pcfs9Ze5/9fj3PffBJ4K7PnLn3rHW++7u/OzITSZMtIpYBewL7AbsBy9svgBXt1znA6cDZmbmqIqek8QkHAGlyRcTGwOHAkcBWc/zPVgLHAMdn5p9GlU1SLQcAaUJFxP7AccD2C/wWFwJHZOapS5dKUlcsqw4gaWlF42jgFBbe/Gn/21Mi4uiIiCUJJ6kzXAGQJkjbqN8NHLbE3/pE4M  he emphasised, this entity must have <em>absolute<\/em> decision-making power over matters affecting the community it represents.<\/p>\n<p>His thoughts were elaborated most fully in his famous <em>Leviathan<\/em> (1651).<\/p>\n<p>The book is considered the foundation of modern political theory for its representation of people as constituting an abstract legal entity - the “artificial person” of the state. Later criticisms of this assumed primacy of the state over the people - or 'civil society' - will provide the basis for the development of a <em>sociological<\/em> tradition in explaining the relationship between individual persons and the communities they aggregate in. Reinhard Koselleck (1959), for instance, was among the first to argue that the enlightenment thinkers of the eighteen century in France, England and Scotland were responding with their critiques to the crisis of sovereign absolutism and its Hobbesian justifications. Hobbes had offered his solution to the <em>bellum omnium contra omnes<\/em>, for which the eighteenth-century philosophers were seeking alternatives.<\/p>\n<\/div>","y":0,"x":-10066636800000,"start":-10413792000000,"end":-9814262400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAN1wAADdcBQiibeAAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d13uGV1df/x9xqqCoIKIkMxNkBA/WkgAjY0VkQRAUEUS0ysaIhiL6DRqBESYkhiD4qNCAEUsRusWLBjwQYCDo6igoBIm/X7Y+/BO8Pcfs9Ze5/9fj3PffBJ4K7PnLn3rHW++7u/OzITSZMtIpYBewL7AbsBy9svgBXt1znA6cDZmbmqIqek8QkHAGlyRcTGwOHAkcBWc/zPVgLHAMdn5p9GlU1SLQcAaUJFxP7AccD2C/wWFwJHZOapS5dKUlcsqw4gaWlF42jgFBbe/Gn/21Mi4uiIiCUJJ6kzXAGQJkjbqN8NHLbE3/pE4MnpG4Y0MVwBkCbLUSx986f9nkeN4PtKKuIKgDQh2mv+pwCjWq5P4AD3BEiTwQFAmgDtbv/zWNw1/7m4ENjRuwOk/vMSgDQZDmf0zZ+2xuFjqCNpxFwBkHquPeRnBXO/z3+xVgLLPSxI6jdXAKT+25PxNX/aWnuOsZ6kEXAAkPpvv4HUlLSEHACk/tttIDUlLSEHAKn/ls/+r0xETUlLyAFA6j8HAEnz5l0AUs9FRMkvcWb6fACpx1wBkCRpgBwAJEkaIAcASZIGyAFAkqQBcgCQJGmAHAAkSRogBwBJkgbIAU lutions","showInLegend":false,"colorByPoint":true,"enableMouseTracking":true,"custom":{"excludeFromGroupFade":true},"point":{"fill":"red","events":{"mouseOver":"SocTime.eventMouseOver","mouseOut":"SocTime.eventMouseOut","click":"SocTime.eventClick"}},"tooltip":{"pointFormatter":"SocTime.eventTooltipFormatter"}},{"data":[{"event_name":"The print revolution","start_date":"1440-01-01","end_date":"1500-01-01","ref_point":"1470-01-01","description":"<div class='timeline-md'><p>The invention of the movable-type printing press in mid-15<sup>th<\/sup> century Germany can be seen as the first <em>informational revolution<\/em> since the invention of writing itself some four and a half millennia earlier. The innovation is primarily associated with the workshop of entrepreneur <strong>Johannes Gutenberg (c. 1398-1468)<\/strong> in Mainz, who famously produced a first print edition of the Bible in 1456. A local war (the <a href=\"https://en.wikipedia.org/wiki/Mainz_Diocesan_Feud\">Mainz Diocesan Feud<\/a>) in 1461/1462 led most of the printers to flee the city and establish their own printing workshops across Germany. By the end of the century, the new art had spread to all corners of the European continent, and biographer Kapr estimates that by &quot;1500, at some 255 printing locations, at least 30,000 printed items must have been published, in a total edition of 20 million copies&quot; (1996: 285). These included not only serious religious and scientific texts, but also pamphlets, poetry and romantic novels, much of which was undoubtedly seen as 'print slop' by contemporary scholars, to adopt our twenty-first century terminology.<\/p>\n<p>Historian Elizabeth Eisenstein also emphasised the revolutionary nature of the invention. Analysing early popular reactions to the vast amount of books suddenly made available by the new technology, she notes that 'the initial increase in output did strike contemporary observers as sufficiently remarkable to suggest supernatural intervention' (1997: 50). The increase in efficiency and reduction in costs was incredible, since a press could produce 1025 copies of a book such as Plato's <em>Dialogues<\/em> for only three times as much as it would cost a scribe to produce a single copy (Eisenstein 1997: 46). But the printing press had an even deeper effect on scientific production: before, &quot;[m]en of learning had to engage in 'slavish copying' of tables, diagrams and unfamiliar terms. The output of whole editions of sets of astronomical tables did not 'intensify' previous trends. It reversed them, producing a new situation which released time for observation and research&quot; (1997: 47).<\/p>\n<p>The increasing availability of print books and the diversification of genres contributed to the increase in literacy rates during the 15<sup>th<\/sup>-16<sup>th<\/sup> centuries, laying down the intellectual foundation for the Protestant Reformation and the Enlightenment. It has also arguably prefigured the industrial revolution of the 18<sup>th<\/sup> century; in the words of Sigfrid Henry Steinberg, it 'introduced into Europe, more than three centuries ahead of its general adoption by industry, the &quot;theory of interchangeable parts&quot; which is the basis of all modern mass-manufacturing technique' (cited in Eisenstein 1997: 32).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Eisenstein, E.L. (1997) <em>The printing press as an agent of change: communications and cultural transformations in early-modern Europe<\/em>. Reprint., combined paperback ed. Cambridge: Cambridge Univ. Press.<\/p>\n<p>Kapr, A. (1996) <em>Johann Gutenberg: the man and his invention<\/em>. Guildford: Scolar Press.<\/p>\n<\/reference>\n<\/div>","y":0,"x":-15778454400000,"start":-16725225600000,"end":-14831769600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAACAASURBVHic7d13mCVVnf/x9/TMMImBCWQG
