  <script>window.SocTimeConfig = {"labelCutoffYear":null,"tickIntervalMs":1576800000000,"tickYears":50,"infoTitle":"A timeline of sociology","infoText":"<p>Six pages cover the first five hundred years of writing about society, one for each period: Sources (1300–1650), Origins (1650–1840), Consolidation (1840–1920), Crisis (1920–1960), Reconstruction (1960–2000) and Decentring (2000–2040). A person appears on the page of the period to which their work belongs, or on two pages where it belongs to both, and their bar runs from birth to death; the bar of a living person fades out at the current date. The colour of a bar is keyed to the place where the person was born, with a small number of corrections where a birthplace misrepresents where they worked. The book icons along a bar are selected works, and the icons in the bottom row are the political, ideational and technological events of the period. Hover for the essentials and click for a biography, a summary of a work or a description of an event; scroll the rows with the mouse wheel, and zoom by dragging across the years.<\/p>\n<p>The dropdown at the top highlights one tradition of enquiry and fades everyone who does not carry it. The traditions are recurring problems rather than schools, so a person can belong to several:<\/p>\n<ul>\n<li>Critical – unmasking what a society takes as natural, by fable, satire and logic<\/li>\n<li>Utopian – what society could be under ideal conditions, with the dystopia as its mirror<\/li>\n<li>Revolutionary – overturning the unmasked order rather than describing it<\/li>\n<li>Historical – history as the force that shapes the present, and comparison across time<\/li>\n<li>Statistical – the average and the aggregate as the reality a science can reach<\/li>\n<li>Civic – improving actual conditions, against abstraction and against the ideal<\/li>\n<li>Biological – the human animal, and what biology allows a society to be<\/li>\n<li>Cultural – shared mental structures and language, and comparison across cultures<\/li>\n<li>Relational – society as relations and forms of association rather than persons or wholes<\/li>\n<\/ul>\n","periodId":"sources","periodLabel":"Sources","prevHref":null,"prevLabel":null,"nextHref":"origins.html","nextLabel":"Origins","indexHref":"index.html","portraitPx":37,"traditions":[{"id":"critical","label":"Critical"},{"id":"utopian","label":"Utopian"},{"id":"revolutionary","label":"Revolutionary"},{"id":"historical","label":"Historical"},{"id":"civic","label":"Civic"},{"id":"biological","label":"Biological"},{"id":"cultural","label":"Cultural"}]};</script>

lor":"#008C4580","birth":-15362697600000,"death":-13557283200000,"birth_label":"06 Mar 1483","death_label":"22 May 1540","living":false},{"author":"Francisco de Vitoria","author_long":"Francisco de Vitoria","tags":["civic","cultural"],"y":10,"x":-15352588800000,"x2":-13360896000000,"color":"#D81B6080","birth":-15352588800000,"death":-13360896000000,"birth_label":"1483","death_label":"12 Aug 1546","living":false},{"author":"Martin Luther","author_long":"Martin Luther","tags":"revolutionary","y":11,"x":-15341184000000,"x2":-13376016000000,"color":"#FFCC0080","birth":-15341184000000,"death":-13376016000000,"birth_label":"10 Nov 1483","death_label":"18 Feb 1546","living":false},{"author":"Thomas Müntzer","author_long":"Thomas Müntzer","tags":["revolutionary","utopian"],"y":12,"x":-15163200000000,"x2":-14030236800000,"color":"#FFCC0080","birth":-15163200000000,"death":-14030236800000,"birth_label":"1489","death_label":"27 May 1525","living":false},{"author":"Jean Bodin","author_long":"Jean Bodin","tags":["historical","cultural"],"y":13,"x":-13869446400000,"x2":-11786601600000,"color":"#00009180","birth":-13869446400000,"death":-11786601600000,"birth_label":"1530","death_label":"1596","living":false},{"author":"Michel de Montaigne","author_long":"Michel Eyquem de Montaigne","tags":["critical","cultural"],"y":14,"x":-13785379200000,"x2":-11906438400000,"color":"#00009180","birth":-13785379200000,"death":-11906438400000,"birth_label":"28 Feb 1533","death_label":"13 Sep 1592","living":false},{"author":"Francis Bacon","author_long":"Francis Bacon, 1st Viscount St Alban","tags":["critical","utopian"],"y":15,"x":-12904963200000,"x2":-10847088000000,"color":"#C8102E80","birth":-12904963200000,"death":-10847088000000,"birth_label":"22 Jan 1561","death_label":"09 Apr 1626","living":false},{"author":"Hugo Grotius","author_long":"Hugo Grotius (Huig de Groot)","tags":"historical","y":16,"x":-12204000000000,"x2":-10235289600000,"color":"#8E24AA80","birth":-12204000000000,"death":-10235289600000,"birth_label":"10 Apr 1583","death_label":"28 Aug 1645","living":false},{"author":"Thomas Hobbes","author_long":"Thomas Hobbes","tags":["biological","critical"],"y":17,"x":-12046579200000,"x2":-9153907200000,"color":"#C8102E80","birth":-12046579200000,"death":-9153907200000,"birth_label":"05 Apr 1588","death_label":"04 Dec 1679","living":false},{"author":"René Descartes","author_long":"René Descartes","tags":["critical","biological"],"y":18,"x":-11794550400000,"x2":-10094630400000,"color":"#00009180","birth":-11794550400000,"death":-10094630400000,"birth_label":"31 Mar 1596","death_label":"11 Feb 1650","living":false}],"name":"Lifespan","colorByPoint":true,"showInLegend":false,"zIndex":2,"states":{"hover":{"enabled":false},"inactive":{"enabled":false}},"tooltip":{"headerFormat":"","pointFormatter":"SocTime.lifespanTooltipFormatter"}},{"data":[{"id":"marsilius","author":"Marsilius of Padua","author_long":"Marsilius of Padua (Marsilio dei Mainardini)","surname":"Marsilius","initials":"MP","bio":"<div class='timeline-md'><p>Marsilius of Padua (c. 1275 – c. 1342) was the son of a Paduan lawyer, studied at the university of his native city and then moved to Paris, where he taught and rose to be Rector of the University in 1312 (Skinner 1978a: 52). Padua was one of the Lombard city republics, whose difficulty in his lifetime, in Skinner's reconstruction, was to find &quot;a form of political argument capable of vindicating their liberty against the Church without involving them in ceding it to anyone else&quot; (Skinner 1978a: 18). Within four years of his finishing the book that supplied one, Padua itself passed from republican government to tyranny (Skinner 1978a: 53).<\/p>\n<p>That book is the <em>Defensor pacis<\/em>, completed in 1324. Its first discourse describes how a city republic works and places sovereign authority in &quot;the people or the whole body of citizens, or the weightier part thereof&quot;, which delegates power to elected and removable rulers and never gives it away (Skinner 1978a: 61–63). The second and longer discourse denies that the Church can exercise coercive jurisdiction of any kind: it is a congregation of the faithful, a priest's office is to teach, and every coercive power belongs to &quot;the faithful human legislator&quot; (Skinner 1978a: 19–21). The society diagnosed is an Italy torn by faction and papal interference, and the remedy is that peace, the precondition of a sufficient life, is kept when the people themselves act as its defender (Skinner 1978a: 56–58, 65). John XXII declared several of these views heretical in 1327, and Marsilius spent his remaining years at the court of Ludwig of Bavaria (Nederman and Mulieri 2025: section 12).<\/p>\n<p>The claim that the whole body of citizens, and neither a priesthood nor a prince, makes the law was stated in 1324, in a work written to solve the actual problems of actual Italian cities. Marsilius belongs to the critical tradition because his second discourse unmasks the powers of the papacy as &quot;usurpations&quot;, and to the civic tradition because his remedy was institutional and aimed at the betterment of the cities he knew rather than at an ideal (Skinner 1978a: 21, 60–61).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 12, 'Marsilius of Padua'.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 18–22 and 52–65.<\/p>\n<p>Wikipedia. &quot;Marsilius of Padua.&quot; Accessed 13 September 2026.<\/p>\n<p><em>Stanford Encyclopedia of Philosophy<\/em>. &quot;Marsilius of Padua.&quot; Accessed 13 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Padua, Italy","pod":"Munich, Duchy of Bavaria (Germany)","tags":["critical","civic"],"image_sq":"author_photos/marsilius.png","image_circle":"author_photos/circles/marsilius.png","living":false,"y":1,"x":-21916396800000,"birth":-21916396800000,"death":-19802102400000,"birth_label":"1275","death_label":"1342"},{"id":"ockham","author":"William of Ockham","author_long":"William of Ockham","surname":"Ockham","initials":"WO","bio":"<div class='timeline-md'><p>William of Ockham (c. 1287–1347) was a Franciscan trained at Oxford and the most original exponent of the <em>via moderna<\/em>, the last school of medieval scholasticism, which held with him that the dogmas of revealed religion &quot;cannot evidently be known&quot; by reason (Skinner 1978b: 23–24). Philosophers remember him as the most influential early proponent of nominalism (Nederman and Mulieri 2025: section 13), the doctrine that reality &quot;consists only in individuals&quot;, so that to speak of a church or a guild is to name the joint behaviour of its members (Nisbet 1973: 126). Summoned to Avignon in 1324 to answer for his theology, he was drawn there into the dispute between John XXII and his order over apostolic poverty, fled on the night of 26 May 1328 with the minister general Michael of Cesena, was excommunicated, and lived out his life at the court of Ludwig of Bavaria in Munich.<\/p>\n<p>The dispute concerned apostolic poverty. The Franciscans claimed to use goods without owning them; the pope, in the bull <em>Quia quorundam mentes<\/em> of 10 November 1324, called their order a merely &quot;represented and imaginary person&quot;, which could not have the use of anything (Lambertini 2023: 79–80). From 1328 Ockham devoted himself to defending the Franciscan ideal and the imperial claims of Ludwig, in &quot;a series of stinging attacks on the papacy’s heretical condemnation&quot; of the friars' doctrines (Nederman and Mulieri 2025: section 13). Skinner reads him as more moderate than Marsilius: the pope remains head of the Church, but his supremacy is given &quot;only for the good of his subjects&quot;, and the spiritual and temporal spheres must be kept apart (Skinner 1978b: 38–39). His <em>Dialogus<\/em> argues that the laity, and women among them, may take part in a general council (Nederman and Mulieri 2025: section 13).<\/p>\n<p>The nominalist doctrine worked in two directions. The doctrine that only individuals are real was, in Nisbet's reading, the weapon that dissolved the corporate bodies of medieval society, yet in 1324 it was the pope who declared an order imaginary and the nominalist who defended the friars. Ockham belongs to the critical tradition because he turned logic on the claims of the most powerful institution of his world and denied them one at a time.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Lambertini, Roberto. 2023. 'Enrico del Carretto: Why a Religious Order Is Not a Mere Collection of Individuals'. In Jenny Pelletier and Christian Rode (eds), <em>The Reality of the Social World: Medieval, Early Modern, and Contemporary Perspectives on Social Ontology<\/em>. Cham: Springer, pp. 79–91.<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 13, 'William of Ockham'.<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 125–126.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 23–24 and 37–39. First published 1978.<\/p>\n<p>Wikipedia. &quot;William of Ockham.&quot; Accessed 13 September 2026.<\/p>\n<p><em>Stanford Encyclopedia of Philosophy<\/em>. &quot;William of Ockham.&quot; Accessed 13 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Ockham, Surrey, England","pod":"Munich, Duchy of Bavaria (Germany)","tags":"critical","image_sq":"author_photos/ockham.png","image_circle":"author_photos/circles/ockham.png","living":false,"y":2,"x":-21537705600000,"birth":-21537705600000,"death":-19651507200000,"birth_label":"1287","death_label":"09 Apr 1347"},{"id":"khaldun","author":"Ibn Khaldun","author_long":"Abu Zayd ‘Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami","surname":"Khaldun","initials":"IK","bio":"<div class='timeline-md'><p>Ibn Khaldun was born in Tunis in 1332 into a family of Arab Yemenite descent that had settled first in Muslim Spain (Dhaouadi 1990: 320). His schooling ran along three lines. The first was the Islamic sciences of the Koran, the Hadith and Malikite jurisprudence, the second the sciences of the Arabic language, and the third logic, philosophy, natural science and mathematics (Dhaouadi 1990: 321). The plague of 1349 cut it short, devastating the Maghreb and killing his parents along with many of his teachers. What followed was a career in office. He was General Secretary to the King of Tunisia, sat on the Higher Scientific Council in Fez, spent 1358 to 1360 in prison for his part in court intrigue, was twice the honoured guest of the ruler of Granada in Muslim Spain, and then, out of the reach of Fez, withdrew with his family to Kalaat Bani Salama in the province of Oran (Dhaouadi 1990: 321).<\/p>\n<p>The four quiet years there produced the work he is remembered for. The <em>Muqaddimah<\/em>, written in five months as the introduction to his history <em>Al ‘Ibar<\/em>, announces a new science, <em>‘Ilm Al ‘Umran<\/em>, the science of civilisation (Dhaouadi 1990: 321). Ibn Khaldun had grown dissatisfied with the historians of his own tradition, who narrated the events of Arab-Muslim history without analysing the forces that produced them (Dhaouadi 1990: 322). Holding his own argument together is <em>al-‘assabiyya<\/em>, from the Arabic root meaning to bind (Dhaouadi 1990: 325): the group feeling that ties blood relatives and, by extension, allies and clients into a body capable of acting as one. It is strongest among the tribes of the desert and weaker in the cities, which is why dynasties founded by nomads conquer settled ones and then lose, within a few generations, the solidarity that carried them there.<\/p>\n<p>He described the book himself as a commentary &quot;on civilisations, on urbanisation, and on the essential characteristics of human social organisation, in a way that explains to the reader how and why things are as they are&quot; (Ibn Khaldun 1974, I: 3–9, quoted in Dhaouadi 1990: 324). A systematic analysis of how societies hold together and come apart was written in North Africa four centuries before anyone in Europe proposed a science of society, and the discipline has mostly not counted it. In the history of sociology that Harry Elmer Barnes assembled in 1948, nearly a thousand pages long, Ibn Khaldun appears twice (Dufoix 2022: 865).<\/p>\n<p>Ibn Khaldun belongs to the historical tradition for turning the narration of events into an inquiry into the forces that produced them, and for reading the state of a dynasty off the generations that stand behind it. The revolutionary tradition he carries for making the overthrow of a ruling order the regular mechanism of his science rather than a breakdown of it, since the desert tribes that conquer the settled dynasties go on to lose the solidarity that carried them there and are conquered in their turn. The cultural tradition is the third, and the group feeling at the centre of the argument is what places him in it, a shared disposition among people bound by blood and by alliance which differs in strength between the desert and the city and which explains why what the two build differs too.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Dhaouadi, Mahmoud. 1990. ‘Ibn Khaldun: The Founding Father of Eastern Sociology’. <em>International Sociology<\/em> 5(3): 319–335.<\/p>\n<p>Dufoix, Stéphane. 2022. ‘A Larger Grain of Sense. Making Early Non-Western Sociological Thought Visible’. <em>Sociedade e Estado<\/em> 37(3): 861–884.<\/p>\n<p>Ibn Khaldun. 1974. <em>The Muqaddimah<\/em>, translated by F. Rosenthal and edited and abridged by N. J. Dawood (Bollingen Series). Princeton: Princeton University Press.<\/p>\n<p>Wikipedia. &quot;Ibn Khaldun.&quot; Accessed 9 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Tunis, Hafsid Sultanate (Tunisia)","pod":"Cairo, Mamluk Sultanate (Egypt)","tags":["historical","revolutionary","cultural"],"image_sq":"author_photos/khaldun.png","image_circle":"author_photos/circles/khaldun.png","living":false,"y":3,"x":-20120659200000,"birth":-20120659200000,"death":-17791660800000,"birth_label":"27 May 1332","death_label":"17 Mar 1406"},{"id":"pizan","author":"Christine de Pizan","author_long":"Christine de Pizan (Cristina da Pizzano)","surname":"Pizan","initials":"CP","bio":"<div class='timeline-md'><p>Christine de Pizan (1364 – c. 1430) was born in Venice, the daughter of a physician and astrologer whose training won him a post at the court of Charles V of France, and she grew up at that court. Her husband, Étienne du Castel, died in 1389, when she was twenty-five, leaving her three children, a widowed mother and an orphaned niece to support, and she turned to writing &quot;both for consolation and for income&quot;, producing poetry, biography and works on politics, chivalry, warfare, religion and philosophy (Nederman and Mulieri 2025: section 16). She is considered the earliest woman of letters of France, and her last years were probably spent in the Dominican convent at Poissy, during the civil war and the English occupation of Paris.<\/p>\n<p><em>Le Livre de la Cité des Dames<\/em> (1405) builds a city of women as a defence against the misogyny of the learned. In it Ceres and Isis &quot;taught [the people] to build cities and towns&quot;, and women developed most of the arts and civilised forms of labour, so that without them humanity would have stayed in a &quot;bestial&quot; state (Nederman and Mulieri 2025: section 16). <em>Le Livre du corps de policie<\/em> (1407), written for the fourteen-year-old dauphin, takes the image of the body politic from John of Salisbury and alters it. The clergy are no longer the soul but one of three branches of the common people, the king is the ordainer of all the estates, and craftsmen and peasants are members without whose labour &quot;the republic … could not sustain itself&quot; (Nederman and Mulieri 2025: section 16). The society diagnosed is a France of financial pressure on the crown and hardship among the rural poor, and the advice given is practical: pay the soldiers, tax reasonably, and hear the common people on how they make their profit.<\/p>\n<p>A widow writing for money in 1405 imagined a whole city arranged so that the contributions of women were visible, and two years later told a future king that the health of the whole community was the measure of good rule. Christine de Pizan belongs to the utopian tradition for the imagined city and to the civic tradition for advice addressed to actual rulers about actual conditions.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 16, 'Christine de Pizan'.<\/p>\n<p>Wikipedia. &quot;Christine de Pizan.&quot; Accessed 13 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Venice, Republic of Venice (Italy)","pod":"Poissy, France","tags":["civic","utopian"],"image_sq":"author_photos/pizan.png","image_circle":"author_photos/circles/pizan.png","living":false,"y":4,"x":-19107792000000,"birth":-19107792000000,"death":-17025120000000,"birth_label":"1364","death_label":"1430"},{"id":"bruni","author":"Leonardo Bruni","author_long":"Leonardo Bruni (Leonardo Aretino)","surname":"Bruni","initials":"LB","bio":"<div class='timeline-md'><p>Leonardo Bruni (c. 1370–1444) came from Arezzo, studied law, rhetoric and Greek in Florence in the 1390s as one of the closest disciples of the chancellor Coluccio Salutati, entered the papal Curia as a secretary in 1406, returned to Florence after 1415 and served as Chancellor of the Republic from 1427 until his death (Skinner 1978a: 72). Pocock calls him &quot;the premier political thinker&quot; among those who lived through the idealisation of the Florentine republic after 1400 and its decline into the crisis of 1434, when Cosimo de' Medici took power behind a republican façade (Pocock 2003: 86).<\/p>\n<p>His <em>Laudatio Florentinae urbis<\/em>, the Eulogy of Florence composed in 1403–1404 on Baron's dating, praises a city whose citizens &quot;rejoice very greatly in the liberty of all peoples, and are thus the absolute enemies of all tyrants&quot; (Skinner 1978a: 78), and argues that Florence, founded by the Roman Republic rather than by Caesar, inherited a liberty that Rome lost when &quot;the Republic was transferred into the hands of a single man&quot; (Skinner 1978a: 83). The funeral oration for Nanni Strozzi adds the element that Skinner finds original. Because &quot;the hope of rising to public honours … is the same for everyone&quot; in a republic, the energies of the citizens are released and the city grows great (Skinner 1978a: 80). The <em>Historiarum Florentini populi libri XII<\/em>, written from 1415 and published by the Florentine Signoria in 1442, makes this the organising principle of a history, in which greatness follows from the freedom to take part in government and corruption from its loss (Skinner 1978a: 83–84). His later writings record a change he did not quite call decline, the passage from a popular state to a mixed one once the many ceased to bear arms (Pocock 2003: 89–90).<\/p>\n<p>Bruni made a free city the subject of its own history and made participation the cause of its greatness. He belongs to the civic tradition because his subject was the actual constitution of Florence and what it did to its citizens, and to the historical tradition because he read Rome and Florence as one story in which liberty and greatness rise and fall together.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Pocock, J. G. A. 2003. <em>The Machiavellian Moment: Florentine Political Thought and the Atlantic Republican Tradition<\/em>. Princeton: Princeton University Press, pp. 52 and 86–92. First published 1975.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 72–84.<\/p>\n<p>Wikipedia. &quot;Leonardo Bruni.&quot; Accessed 13 September 2026.<\/p>\n<p>jameshankins.org. Note on the work by James Hankins. Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Arezzo, Tuscany (Italy)","pod":"Florence, Italy","tags":["civic","historical"],"image_sq":"author_photos/bruni.png","image_circle":"author_photos/circles/bruni.png","living":false,"y":5,"x":-18918489600000,"birth":-18918489600000,"death":-16593120000000,"birth_label":"1370","death_label":"09 Mar 1444"},{"id":"erasmus","author":"Erasmus","author_long":"Desiderius Erasmus of Rotterdam","surname":"Erasmus","initials":"E","bio":"<div class='timeline-md'><p>Desiderius Erasmus (1466–1536) was born in Rotterdam or Gouda, studied at the Collège de Montaigu in Paris from 1495, took a doctorate in theology at Turin in 1506 and taught at Cambridge. He met John Colet at Oxford in 1499 and resolved, as he told Colet in 1504, to give &quot;all of the rest of my life&quot; to the study of the scriptures, a resolve that produced the Greek New Testament of 1516, with a Latin translation correcting the Vulgate in print for the first time (Skinner 1978a: 211).<\/p>\n<p><em>The Praise of Folly<\/em>, written at Thomas More's house in 1509 and printed in Paris in 1511 with a punning dedication to More, gives Folly a rostrum from which she names her admirers, the lawyers, the princes and their courtiers, and above all the monks, priests, bishops and pope: &quot;Were wisdom to descend on them, how it would inconvenience them!&quot; (Skinner 1978b: 29). Nisbet reads the book as a diagnosis of a Christian civilisation that had become &quot;a thing of empty forms, ceremonies, dogmas, and rituals&quot;, and argues that by treating the church as a purely human institution the humanists brought society &quot;into a more finite compass that would in time suggest the possibility of an outright philosophy of society, even a science of society&quot; (Nisbet 1973: 197, 199). <em>The Education of a Christian Prince<\/em>, presented to the future Charles V in 1516, asks the question that Machiavelli was asking in the same years and gives the opposite answer, that a ruler who cannot keep his state without injustice must &quot;give up and yield to the importunities of the age&quot; (Skinner 1978a: 250). His tract <em>On the Freedom of the Will<\/em> of 1524 was the occasion for the definitive breach between Luther and the humanists (Skinner 1978b: 4), and he died in Basel twelve years later.<\/p>\n<p>The oration of Folly is a piece of unmasking, in which the professed motives of the learned and the powerful are set beside what they actually do. That is why Erasmus stands in the critical tradition, arguably two centuries before Mandeville turned the same device on commercial society.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 195–199.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 211–212, 214, 222–223, 231–233 and 244–250.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 4–6 and 29.<\/p>\n<p>Wikipedia. &quot;Erasmus.&quot; Accessed 13 September 2026.<\/p>\n<p>Wikipedia. &quot;In Praise of Folly.&quot; Accessed 13 September 2026.<\/p>\n<p>Wikipedia. &quot;The Education of a Christian Prince.&quot; Accessed 13 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Rotterdam, Burgundian Netherlands (Netherlands)","pod":"Basel, Switzerland","tags":"critical","image_sq":"author_photos/erasmus.png","image_circle":"author_photos/circles/erasmus.png","living":false,"y":6,"x":-15878764800000,"birth":-15878764800000,"death":-13679107200000,"birth_label":"28 Oct 1466","death_label":"12 Jul 1536"},{"id":"machiavelli","author":"Niccolò Machiavelli","author_long":"Niccolò di Bernardo dei Machiavelli","surname":"Machiavelli","initials":"NM","bio":"<div class='timeline-md'><p>Niccolò Machiavelli (1469–1527) was born in Florence and in 1498, the year in which Savonarola fell, was made second chancellor of the republic. For fourteen years he served it as a diplomat and, from 1506, as secretary of the committee that raised the citizen militia he had argued for (Skinner 2000: 3, 37). When the Medici returned in 1512 he was dismissed, and in February 1513 he was imprisoned and tortured on a mistaken charge of conspiracy. Released, he withdrew to his farm at Sant'Andrea in Percussina, where in the second half of 1513 he wrote the &quot;little book On Principalities&quot; that became <em>The Prince<\/em> (Skinner 2000: 22–25).<\/p>\n<p><em>The Prince<\/em> is a contribution to the humanist genre of advice-books for rulers that overturns its central assumption. Where the humanists held that virtue leads to honour, Machiavelli holds that &quot;the gulf between how one should live and how one does live is so wide that a man who neglects what is actually done for what should be done learns the way to self-destruction rather than self-preservation&quot; (Skinner 1978a: 133). The <em>Discourses on Livy<\/em>, written around 1517, read Roman history as a store of comparisons and reach the judgement that horrified his contemporaries, that the &quot;tumults&quot; between plebs and senate were &quot;the primary cause of Rome's retaining her freedom&quot; (Skinner 1978a: 181). The <em>Florentine Histories<\/em>, commissioned in 1520 and presented to Clement VII in 1525, reverse the panegyric purpose of humanist history to tell a story of corruption (Skinner 2000: 92–93). Aron defines Machiavellianism as the attempt &quot;to see through the hypocrisies of the social comedy, to single out the true feelings that motivate men&quot;, and places Pareto in that line (Aron 2018: 6). Nisbet finds beneath the maxims &quot;a preoccupation with the problem of order&quot; left by the breakup of medieval society (Nisbet 1973: 63).<\/p>\n<p>Machiavelli studied what people do rather than what they ought to do. He belongs to the critical tradition for that unmasking, to the historical tradition because Rome supplied his comparisons, and to the revolutionary tradition because he defended the tumults of Rome and the extraordinary acts of founders as the sources of a free state (Skinner 1978a: 181, 184).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Aron, Raymond. 2018. <em>Main Currents in Sociological Thought, Volume Two: Durkheim, Pareto, Weber<\/em>. Abingdon: Routledge, p. 6. First published in English 1967.<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 55–63 and 129–130.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 128–138 and 180–187.<\/p>\n<p>Skinner, Quentin. 2000. <em>Machiavelli: A Very Short Introduction<\/em>. Oxford: Oxford University Press, pp. 3, 20–27, 35–37 and 88–99.<\/p>\n<p>Wikipedia. &quot;Niccolò Machiavelli.&quot; Accessed 13 September 2026.<\/p>\n<p><em>Stanford Encyclopedia of Philosophy<\/em>. &quot;Niccolò Machiavelli.&quot; Accessed 13 September 2026.<\/p>\n<p>Wikipedia. &quot;Florentine Histories.&quot;<\/p>\n<\/reference>\n<\/div>","pob":"Florence, Republic of Florence (Italy)","pod":"Florence, Italy","tags":["critical","historical","revolutionary"],"image_sq":"author_photos/machiavelli.png","image_circle":"author_photos/circles/machiavelli.png","living":false,"y":7,"x":-15799449600000,"birth":-15799449600000,"death":-13965004800000,"birth_label":"03 May 1469","death_label":"21 Jun 1527"},{"id":"more","author":"Thomas More","author_long":"Thomas More","surname":"More","initials":"TM","bio":"<div class='timeline-md'><p>Thomas More (1478–1535) was a London lawyer and humanist, the friend to whom Erasmus dedicated <em>The Praise of Folly<\/em>, and in Skinner's estimate &quot;by far the greatest of these political theorists&quot; and &quot;also the most successful in the world of political action&quot;, becoming Speaker of the House of Commons in 1523 and Lord Chancellor of England in 1529 (Skinner 1978a: 216). He wrote <em>Utopia<\/em> in 1515, at the moment he had decided to enter the royal service, completing the first book after a diplomatic mission and drafting the second while at Antwerp on the embassy itself; it was printed in Latin in 1516 and in English in 1551 (Skinner 1978a: 218; Nisbet 1973: 338). He refused to acknowledge the king as head of the Church, was convicted on 1 July 1535 and beheaded on Tower Hill five days later.<\/p>\n<p><em>Utopia<\/em> gave English the words utopia and utopian (Nisbet 1973: 351) and describes the England of Henry VIII by its opposite. Book I holds the &quot;dialogue of counsel&quot;, in which Hythlodaeus argues that no wise man can do good at court, and the indictment of enclosure, with sheep that &quot;eat up and swallow down the very men themselves&quot; (Skinner 1978a: 218; Nisbet 1973: 342). Book II describes a commonwealth without money or private property, and contains the sentence that Davidson reads as its implicit social theory: &quot;I am wholly convinced that unless private property is entirely abolished, there can be no fair or just distribution of goods, nor can the business of mortals be conducted happily&quot; (More 2002: 38, quoted in Davidson 2021: 1073). Skinner reads the book as &quot;by far the most radical critique of humanism written by a humanist&quot;, following the commonplace that virtue is the only nobility to the conclusion that 'degree' itself must go (Skinner 1978a: 256, 259–260); Nisbet reads it as a traditionalist evocation of the monastic and village community that Tudor centralisation was destroying (Nisbet 1973: 343).<\/p>\n<p>Describing a better society in full is a way of stating what holds an actual one together, since the writer has to decide what determines everything else. More belongs to the utopian tradition because he invented the form in which that decision is made in advance and in detail.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Davidson, Joe P. L. 2021. 'Looking Laterally: The Literary Utopia and the Task of Critical Social Theory'. <em>Current Sociology<\/em> 69(7): 1069–1084, at pp. 1073–1074.<\/p>\n<p>More, Thomas. 2002. <em>Utopia<\/em>, ed. George M. Logan and Robert M. Adams. Cambridge: Cambridge University Press.<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 338–351.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 215–218, 222–223, 233 and 255–262. First published 1978.<\/p>\n<p>Wikipedia. &quot;Thomas More.&quot; Accessed 13 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"City of London, England","pod":"Tower Hill, London, England","tags":"utopian","image_sq":"author_photos/more.png","image_circle":"author_photos/circles/more.png","living":false,"y":8,"x":-15522796800000,"birth":-15522796800000,"death":-13711248000000,"birth_label":"07 Feb 1478","death_label":"06 Jul 1535"},{"id":"guicciardini","author":"Francesco Guicciardini","author_long":"Francesco Guicciardini","surname":"Guicciardini","initials":"FG","bio":"<div class='timeline-md'><p>Francesco Guicciardini (1483–1540) came from one of the most prominent aristocratic families of Florence, trained as a lawyer, and was sent by the republic in 1512 as its ambassador to Ferdinand of Aragon in Spain. He drafted his first political tract on that embassy, the <em>Discourse of Logrogno<\/em>, and his next treatise was the <em>Dialogue on Florentine Government<\/em> (Skinner 1978a: 155). The rest of his career was made in the service of the papacy rather than of the city, as governor of Reggio and of Modena, as viceregent of the Romagna and as lieutenant-general of the papal army in 1526. Skinner describes the allegiance to political liberty in these writings as consistent but cautious, the outlook of a patrician who warned against those who preach liberty most fervently, because nearly all of them, he thought, had their own interests in view (Skinner 1978a: 155).<\/p>\n<p>The <em>Ricordi<\/em>, the collection of aphorisms he assembled in 1530 while the last Florentine republic was under siege, direct a lifetime of scepticism against the idea that general rules can govern particular cases. The overmastering theme of the collection, in the reading that Pocock gives it, is &quot;the extraordinary difficulty of applying intelligence to the world of events in the form of personal or political action&quot; (Pocock 2003: 267). That difficulty survives all the reading and all the digested conclusions, because the moment at which to act still has to be judged by someone. The same charge of arguing too absolutely from a few historical generalisations is pressed against Machiavelli in the <em>Considerations on the Discourses<\/em> (Skinner 1978a: 169).<\/p>\n<p>The <em>History of Italy<\/em>, written in the closing years of his life, divides the later Renaissance at 1494, the year in which, as the opening explains, &quot;French troops, summoned by our own princes, began to stir up very great dissensions here&quot; (Skinner 1978a: 113). Skinner reads the work as an abandonment of the humanist belief that a historian furnishes his readers with useful precepts, since the narrative recounts a progressive exploitation and collapse and reaches only the conclusion, in the words of Gilbert, of the helplessness and impotence of man in the face of fate (Skinner 1978a: 188).<\/p>\n<p>Guicciardini belongs to the historical tradition for the use he made of comparison across time and for the limits he placed on it. He accepted that history makes the experience of the dead available to those who lack it among the living (Pocock 2003: 220), and he answered those who cite the Romans at every turn with the sarcasm of the maxims, that such comparisons are often as far out of order as expecting a jackass to race like a horse (Skinner 1978a: 169).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Pocock, J. G. A. 2003. <em>The Machiavellian Moment: Florentine Political Thought and the Atlantic Republican Tradition<\/em>. Princeton: Princeton University Press, pp. 220 and 266–270.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 113, 155, 169 and 188.<\/p>\n<p>Wikipedia. &quot;Francesco Guicciardini.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Florence, Republic of Florence (Italy)","pod":"Arcetri, Florence, Italy","tags":"historical","image_sq":"author_photos/guicciardini.png","image_circle":"author_photos/circles/guicciardini.png","living":false,"y":9,"x":-15362697600000,"birth":-15362697600000,"death":-13557283200000,"birth_label":"06 Mar 1483","death_label":"22 May 1540"},{"id":"vitoria","author":"Francisco de Vitoria","author_long":"Francisco de Vitoria","surname":"Vitoria","initials":"FV","bio":"<div class='timeline-md'><p>Francisco de Vitoria (c. 1483–1546) entered the Dominican Order in 1504 and was sent two years later to the Collège de Saint-Jacques in Paris, where he studied under Pierre Crockaert, a convert from the way of Ockham to the way of Aquinas, and stayed nearly eighteen years, first as a student and then lecturing on the <em>Summa<\/em>; in 1512 he and Crockaert published a commentary on it together (Skinner 1978b: 135–136). He returned to Spain in 1523, was elected to the Prime Chair of Theology at Salamanca in 1526 and held it until his death. &quot;Vitoria published nothing&quot;, so his views survive only in manuscript <em>relectiones<\/em>, summaries of a course delivered as orations before the whole faculty, but by his death nearly thirty of his former students held Spanish professorships (Skinner 1978b: 136).<\/p>\n<p>Two relections of 1539 take up the conquests in the Americas. <em>De Indis<\/em> asks &quot;Whether the barbarians were true lords in relation to private and public affairs&quot; before the conquistadores came, and answers that &quot;there can be no doubt that the Indians possessed true dominion both in public and private affairs&quot; (Skinner 1978b: 169). A papal grant is no title, because &quot;the Pope possesses no such power&quot;, and refusal of the faith is no title either, since &quot;even if the Christian faith has been announced to the barbarians with complete and sufficient arguments, and they have still refused to receive it, this still does not supply a reason for making war on them and despoiling them of their goods&quot; (Skinner 1978b: 169–170). <em>De iure belli<\/em>, the second of the pair, treats the law of war in relation to the conquests. Skinner sets both inside the Thomist revival that Vitoria led against Luther and, after the Valladolid conference of 1527, against Erasmus. The temporal commonwealth is &quot;perfect and complete in itself&quot;, men are born free, and political society is a human making of which unbaptised peoples are as capable as Christians (Skinner 1978b: 141, 155–156, 175).<\/p>\n<p>The encounter with the Americas was turned, in a lecture hall in Salamanca, into an argument about the rights of actual peoples. Vitoria belongs to the civic tradition because the argument concerned what was being done to living people, and to the cultural tradition because it rests on the claim that peoples of other religions and customs form genuine political societies.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 135–141, 154–158, 169–170 and 175–176. First published 1978.<\/p>\n<p>Wikipedia. &quot;Francisco de Vitoria.&quot; Accessed 13 September 2026.<\/p>\n<p><em>Encyclopædia Britannica<\/em>. &quot;Francisco de Vitoria.&quot; Accessed 17 September 2026.<\/p>\n<p>Encyclopedia.com. &quot;Francisco de Vitoria.&quot; Accessed 17 September 2026.<\/p>\n<p>Wikidata. &quot;Francisco de Vitoria.&quot;<\/p>\n<\/reference>\n<\/div>","pob":"Burgos, Crown of Castile (Spain)","pod":"Salamanca, Spain","tags":["civic","cultural"],"image_sq":null,"image_circle":null,"living":false,"y":10,"x":-15352588800000,"birth":-15352588800000,"death":-13360896000000,"birth_label":"1483","death_label":"12 Aug 1546"},{"id":"luther","author":"Martin Luther","author_long":"Martin Luther","surname":"Luther","initials":"ML","bio":"<div class='timeline-md'><p>Martin Luther (1483–1546) was born at Eisleben in the county of Mansfeld, entered the Augustinian order, and held the chair of Theology in the University of Wittenberg from 1512 for the rest of his working life. Skinner treats the nailing up of the Ninety-Five Theses on the door of the Castle Church at Wittenberg on the Eve of All Saints in 1517, an act which he notes may not even have happened, as the culmination of a development already traceable in the materials for the lectures on the Psalms and on the Epistles to the Romans and the Galatians between 1513 and 1517 (Skinner 1978b: 3).<\/p>\n<p>That theology carried two political implications. Luther repudiated the claim of the Church to jurisdictional powers, and denounced above all the traffic in indulgences, the subject of the original outburst, holding the belief in their efficacy to be the most wicked perversion of the doctrine that the Church can enable a sinner to attain salvation through its own authority and sacraments (Skinner 1978b: 12). <em>The Freedom of a Christian<\/em> of 1520 carried the second implication into the standing of the laity, and Nisbet places its central claim beside the <em>Appeal to the Ruling Class<\/em> as evidence of how close the early Luther came to the revolutionary mentality, quoting the tract on the point that &quot;we are all priests, and thus greater than mere kings, the reason being that priesthood makes us worthy to stand before God, and to pray for others&quot; (Nisbet 1973: 206).<\/p>\n<p>When the Peasants' War broke out in Germany in 1524, the fear that the radicals would distort his political teaching produced a reaction of shocking brutality. The eirenic <em>Admonition to Peace<\/em> urged the princes to attempt conciliation and reminded the peasants that the wickedness and injustice of rulers does not excuse disorder and rebellion; then, after the peasant victories of May 1525, came the tract <em>Against the Robbing, Murdering Hordes of Peasants<\/em>, which stands squarely on the Pauline command that every person be subject to the governing authorities and concludes that the rebels have abundantly merited death (Skinner 1978b: 18). Roper records that the pamphlet calls on the reader to &quot;smite, slay and stab&quot; them as though they were mad dogs, and that it was in print shortly before thousands of them were killed at Frankenhausen (Roper 2025: 235).<\/p>\n<p>Luther carries the revolutionary tradition for the rupture he opened rather than for any overturning he wanted. The doctrine that every Christian is a priest withdrew at a stroke the standing of a whole order of persons, and the word freedom on the cover of the German edition of 1520 was read by serfs in the south-west of the empire as a warrant for ending serfdom, a reading his supporters afterwards disowned and Roper declines to call a misunderstanding (Roper 2025: 12).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, p. 206.<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 3, 12 and 18.<\/p>\n<p>Wikipedia. &quot;Martin Luther.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Eisleben, County of Mansfeld (Germany)","pod":"Eisleben, Germany","tags":"revolutionary","image_sq":"author_photos/luther.png","image_circle":"author_photos/circles/luther.png","living":false,"y":11,"x":-15341184000000,"birth":-15341184000000,"death":-13376016000000,"birth_label":"10 Nov 1483","death_label":"18 Feb 1546"},{"id":"muntzer","author":"Thomas Müntzer","author_long":"Thomas Müntzer","surname":"Müntzer","initials":"TM","bio":"<div class='timeline-md'><p>Thomas Müntzer was born at Stolberg in the Harz, a mining district some forty kilometres from the birthplace of Luther, and the year is not recorded, though Roper puts it no more than six or seven years after 1483. He moved as a young man to Quedlinburg, a town dominated by its castle and by a great abbey of noble women, and enrolled at the University of Leipzig in 1506, listed as coming from there (Roper 2025: 72). Roper describes a theology at once majestic in its apocalypticism and modest in scope, drawn to the Old Testament and its prophets rather than to the New, and a tactician who bound village and town to his cause by oaths, gathering twelve disciples at Zwickau and a sworn league at Allstedt (Roper 2025: 70, 72). Luther named him the &quot;Satan of Allstedt&quot; and blamed him for the whole of the Peasants' War (Roper 2025: 70).<\/p>\n<p>The sermon that made his name was preached in 1524 in the banqueting hall of the castle at Allstedt, before Duke Johann of Saxony and his son, on the second chapter of Daniel. Müntzer told the princes that their empire would end if they did not destroy the godless, and that the sword would otherwise be taken from them (Roper 2025: 136–137) and given to the sovereign and righteous people (Skinner 1978b: 77). Skinner reads the sermon as the most dramatic instance of genuinely revolutionary politics within the radical Reformation, built on a deliberate misreading of the opening verses of the thirteenth chapter of the Epistle to the Romans, by which the apostolic doctrine of obedience is turned into a demand for a holy war (Skinner 1978b: 77). In April 1525 he wrote from Mühlhausen to his old comrades at Allstedt that the whole of Germany, France and Italy was awake, that they could not slumber any longer, and that they should recruit in the villages and above all among the mine-workers (Roper 2025: 238). The peasant army was destroyed at Frankenhausen in mid-May, and Müntzer was executed on 27 May with his colleague Heinrich Pfeiffer and another twenty-four rebels, their heads set on spikes outside Mühlhausen (Roper 2025: 279).<\/p>\n<p>Müntzer carries the revolutionary and the utopian traditions together, and the two are inseparable in his case. The kingdom of God was to be established on this earth and within this generation, which made the overturning of the princes a religious duty rather than a political calculation, and the sworn league of the elect was the form that the coming order was to take.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 75 and 77. First published 1978.<\/p>\n<p>Wikipedia. &quot;Thomas Müntzer.&quot; Accessed 17 September 2026.<\/p>\n<p><em>Encyclopaedia Britannica<\/em>. &quot;Thomas Muntzer.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Stolberg, County of Stolberg (Germany)","pod":"Mühlhausen, Thuringia (Germany)","tags":["revolutionary","utopian"],"image_sq":"author_photos/muntzer.png","image_circle":"author_photos/circles/muntzer.png","living":false,"y":12,"x":-15163200000000,"birth":-15163200000000,"death":-14030236800000,"birth_label":"1489","death_label":"27 May 1525"},{"id":"bodin","author":"Jean Bodin","author_long":"Jean Bodin","surname":"Bodin","initials":"JB","bio":"<div class='timeline-md'><p>Jean Bodin was born at Angers around 1530, studied Roman law at Toulouse, practised as an attorney of the Parlement of Paris and served after 1576 as a royal attorney at Laon, where he died of plague in 1596. Nisbet places him among the Politiques, the Paris circle of civil servants, men of business and writers who concluded that once Christendom had been divided by doctrinal hatreds, religion could no longer supply the unity and order of Western society, and that the only remaining base was the political nation given legal force by the sovereignty of the political arm over all others (Nisbet 1973: 131). Elected to the States General in 1576, he forfeited his rising favour at court by pressing the deputies to refuse any increase in taxation (Skinner 1978b: 297).<\/p>\n<p>The <em>Method for the Easy Comprehension of History<\/em> of 1566 pursues two purposes at once. The first is an inductive survey of everything that lies beyond human control and still shapes the destiny of commonwealths, ending in a study of climate as the cause of the customs, religions and social structures found in the three climatic zones of the civilised world, a tradition of analysis that Skinner takes to be well established before Montesquieu and developed here to a completeness Montesquieu scarcely exceeded. The second is to gather the laws of the ancient and the modern commonwealths alike and to arrange them in an order from which the common law of all nations can be read off, on the principle stated in the preface that &quot;in history the best part of the universal law lies hidden&quot; (Skinner 1978b: 291–292).<\/p>\n<p><em>The Six Books of a Commonweal<\/em> of 1576 was written at the height of the Huguenot revolution, and it withdraws the constitutional safeguards that the <em>Method<\/em> had sought to impose in favour of an unyielding defence of absolutism (Skinner 1978b: 284). Sovereignty is defined in the Knolles translation as &quot;the most high, absolute, and perpetual power over the subjects and citizens of a commonwealth&quot; (Nisbet 1973: 131), and the highest and in some sense the sole mark of it becomes the power of giving laws to subjects in general without their consent (Skinner 1978b: 289). Nisbet reads the work as the argument of a transitional figure, since the same author who gives the sovereign absolute power keeps the household under the absolute power of the house father, and writes that tyrants have always hated the corporations and communities of the people (Nisbet 1973: 134–135).<\/p>\n<p>Bodin belongs to the historical tradition for making the comparison of every known legal system the method by which a science of politics is to be built, and to the cultural tradition for the books of the <em>Method<\/em> that explain the differing customs, religions and social structures of peoples by the zone of the earth they inhabit.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 131 and 134–135.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 271, 284, 289, 291–292 and 297.<\/p>\n<p>Wikipedia. &quot;Jean Bodin.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Angers, Anjou, France","pod":"Laon, Picardy, France","tags":["historical","cultural"],"image_sq":"author_photos/bodin.png","image_circle":"author_photos/circles/bodin.png","living":false,"y":13,"x":-13869446400000,"birth":-13869446400000,"death":-11786601600000,"birth_label":"1530","death_label":"1596"},{"id":"montaigne","author":"Michel de Montaigne","author_long":"Michel Eyquem de Montaigne","surname":"Montaigne","initials":"MM","bio":"<div class='timeline-md'><p>Michel de Montaigne served from 1557 as a conseiller to the Parlement of Bordeaux, in an office that his father had purchased three years earlier. When promotion to the upper chamber was refused him in 1569 he sold the office at once, and a year later he withdrew to the chateau he had inherited on the death of his father in 1568, setting at the entrance to his study an inscription that recorded his decision to leave the servitude of the court and of public employments (Skinner 1978b: 277). There he began the composition of the <em>Essays<\/em>, a form of writing he may almost be said to have invented, and he was later elected mayor of Bordeaux and served two terms.<\/p>\n<p>Skinner sets the turn to retirement in the context of a revival of stoic doctrines among French humanists in the years after the massacres of 1572 (Skinner 1978b: 276). The reputation for scepticism rests above all on the <em>Apology for Raymond Sebond<\/em>, the longest of the essays, in which the defence of a theologian who had argued that the truths of Christianity can be established from the evidence of nature takes the curious form of insisting that human reason is too weak a guide for any certainty to be possible. It was at this point that he took as his motto the question of what he himself knows, and concluded that reason &quot;does nothing but go astray in everything, and especially when it meddles with divine things&quot; (Skinner 1978b: 280).<\/p>\n<p>Nisbet places <em>Of Cannibals<\/em> very close to the beginning of modern anthropology, both for its subject and for the dispassionate and tolerant spirit in which it approaches the customs of the Tupinambá of Brazil, whom Montaigne held to be closer to nature than Europeans, since &quot;The laws of nature still govern them, very little corrupted by ours&quot; (Nisbet 1973: 201). The essay is frank about the bloody wars and cruelties of those peoples, and its conclusion is that Europeans, given their own barbarities and their religious wars, have no right to judge them morally worse (Nisbet 1973: 202).<\/p>\n<p>Montaigne belongs to the critical tradition because his scepticism is used to unmask, taking the customs of his own country as the thing to be explained rather than the measure of everything else. He belongs to the cultural tradition because the instrument of that unmasking is comparison between peoples, and because the essays range across the whole of what would later be the subject matter of the social sciences, from types of social organisation to wealth and poverty and the place of birth, marriage and death in human societies (Nisbet 1973: 201).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 201–202.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 276–277 and 280. First published 1978.<\/p>\n<p>Wikipedia. &quot;Michel de Montaigne.&quot; Accessed 17 September 2026.<\/p>\n<p>Wikipedia. &quot;Of Cannibals.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Château de Montaigne, Guyenne, France","pod":"Château de Montaigne, Guyenne, France","tags":["critical","cultural"],"image_sq":"author_photos/montaigne.png","image_circle":"author_photos/circles/montaigne.png","living":false,"y":14,"x":-13785379200000,"birth":-13785379200000,"death":-11906438400000,"birth_label":"28 Feb 1533","death_label":"13 Sep 1592"},{"id":"bacon","author":"Francis Bacon","author_long":"Francis Bacon, 1st Viscount St Alban","surname":"Bacon","initials":"FB","bio":"<div class='timeline-md'><p>Francis Bacon (1561–1626) was born into a well-connected family, since his father was Lord Keeper to Elizabeth I, and had the misfortune to be left without much money at the death of that father, so that a good part of his life went in seeking the favour of those who could help him politically and financially. He entered Parliament in 1581, held a series of prized public appointments and became Lord Chancellor, and the scheming came apart when he was accused of taking bribes, fined forty thousand pounds and imprisoned in the Tower of London for corruption; debarred on his release from any further public office, he gave himself full time to research and writing (Oakley 2000: 82). Like Galileo, he had recognised during his university studies the barrenness of much of the Scholastic philosophy then current, and his resolve from that point was to carry the methods and products of natural philosophy into the real world (Oakley 2000: 81–82).<\/p>\n<p><em>The Advancement of Learning<\/em> of 1605 was the first significant philosophical book to be published in English, and its precepts were fully developed in the <em>Novum Organum<\/em> of 1620, one part of the project he called the Great Instauration, from instauratio, a fresh start (Oakley 2000: 82–83). The method is systematic observation and experiment, held to be applicable to every science, including those that govern human political relations, and its induction uses reason to generate theory from facts rather than the other way about (Oakley 2000: 83). What stands in the way are the idols, among them the idols of the theatre, which is what Bacon called traditional academic knowledge because it resembled stage plays creating fictitious and imaginary worlds (Oakley 2000: 82).<\/p>\n<p>Durkheim made those idols the starting point of the second chapter of <em>The Rules of Sociological Method<\/em>, where the preconceptions that stand between the investigator and the facts are identified with the notiones vulgares or praenotiones that Bacon had placed at the basis of all the sciences. They are the &quot;idola which, resembling ghost-like creatures, distort the true appearance of things, but which we nevertheless mistake for the things themselves&quot; (Durkheim 1982: 62), and the danger they carry is greater in sociology than in the natural sciences, because social things are realised by men and so seem to be nothing more than ideas put into operation. Nisbet kept the same vocabulary for what he preferred to call the idols of the profession in his own discipline (Nisbet 1977: 19).<\/p>\n<p>Bacon belongs to the critical tradition because the <em>Novum Organum<\/em> turns the systematic errors of the mind into an object of study, and so treats what an age takes for knowledge as something to be explained and distrusted rather than accepted. He belongs to the utopian tradition for the <em>New Atlantis<\/em>, a mechanistic utopia in which there is no politics because everything is decided by science and by scientists (Oakley 2000: 89).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Durkheim, Émile. 1982. <em>The Rules of Sociological Method<\/em>. New York: Free Press, p. 62.<\/p>\n<p>Nisbet, Robert A. 1977. <em>Sociology as an Art Form<\/em>. Oxford: Oxford University Press, p. 19.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, pp. 81–84 and 89.<\/p>\n<p>Wikipedia. &quot;Francis Bacon.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"The Strand, London, England","pod":"Highgate, London, England","tags":["critical","utopian"],"image_sq":"author_photos/bacon.png","image_circle":"author_photos/circles/bacon.png","living":false,"y":15,"x":-12904963200000,"birth":-12904963200000,"death":-10847088000000,"birth_label":"22 Jan 1561","death_label":"09 Apr 1626"},{"id":"grotius","author":"Hugo Grotius","author_long":"Hugo Grotius (Huig de Groot)","surname":"Grotius","initials":"HG","bio":"<div class='timeline-md'><p>Hugo Grotius (1583–1645) entered the University of Leiden at eleven, became at twelve the pupil of Joseph Scaliger, who directed his study, and well before he was twenty had made a European reputation as a scholar and philosopher of law (Nisbet 1973: 65). Like so many men of that period he entered politics, holding the office of advocate general of the fisc of Holland, Zeeland and Friesland and then the pensionaryship of Rotterdam, and it was out of those experiences, which were bound to bring him into contact with the realities of war and of the military mind, that his classic work came (Nisbet 1973: 66). His part in the Arminian quarrel cost him his liberty in 1618; after escaping from the castle of Loevestein in 1621 he lived in France, and he returned to public affairs as the ambassador of Sweden at the French court.<\/p>\n<p><em>The Rights of War and Peace<\/em> was begun in 1623 and published in 1625, and Nisbet calls it without question the greatest of all works in the sphere of international law, a field brought into existence by the fall of feudal Europe and the rise of the modern nation-states (Nisbet 1973: 66). No basis remained for the religious limitation of war that a religiously unified Europe had once supplied, so Grotius turned instead to natural law, believed at the time to be anterior to all positive law and to all custom, and what preoccupied him was the natural law of states within the international order rather than the natural law of persons within a state (Nisbet 1973: 66). Natural right is defined there as the dictate of right reason, showing the moral turpitude or moral necessity of an act from its agreement or disagreement with a rational nature, and wars of defence against those seeking to destroy or capture a people are just on that ground (Nisbet 1973: 66).<\/p>\n<p>Skinner places the argument in a line of descent from the later Jesuit theorists, who bequeathed to Grotius and his successors a recognisable analysis of international law as a special code of positive law founded on the principles of natural justice, and who had already anticipated in Bellarmine the formula that Grotius was to make famous, that a man would still be able to interpret the law of nature even if, per impossibile, he were not the creation of God (Skinner 1978b: 151, 154). Elden finds the focus of the same book on imperium rather than jurisdiction, exercised primarily over persons and secondarily over the place that is called territory, with a property right at its basis (Elden 2013: 240).<\/p>\n<p>Grotius belongs to the historical tradition because the argument of 1625 is assembled out of the record, a detailed listing of authorities that runs from the Greek and Roman philosophers through the early Christian fathers, and because what the proposals amount to, in the reading that Nisbet gives them, is an effort to restore the limited kind of war that had once existed under the code of chivalry (Nisbet 1973: 67–68).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, p. 240.<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 65–68.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 151 and 154.<\/p>\n<p>Wikipedia. &quot;Hugo Grotius.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Delft, Dutch Republic (Netherlands)","pod":"Rostock, Mecklenburg (Germany)","tags":"historical","image_sq":"author_photos/grotius.png","image_circle":"author_photos/circles/grotius.png","living":false,"y":16,"x":-12204000000000,"birth":-12204000000000,"death":-10235289600000,"birth_label":"10 Apr 1583","death_label":"28 Aug 1645"},{"id":"hobbes","author":"Thomas Hobbes","author_long":"Thomas Hobbes","surname":"Hobbes","initials":"TH","bio":"<div class='timeline-md'><p>Thomas Hobbes was born at Westport, beside Malmesbury in Wiltshire, in 1588, the son of a poor clergyman. An uncle paid for him to go to Oxford, where he complained about not being allowed to study mathematics and learned the classics instead. From 1608 he was attached to the Cavendish family of Derbyshire, the earls and later dukes of Devonshire, and he stayed with that household for most of his long life as tutor, travelling companion and man of business (Runciman 2021: ch. 1). He produced three versions of his political philosophy during the English Civil War, the <em>Elements of Law<\/em> in 1640, <em>De Cive<\/em> in 1642 and <em>Leviathan<\/em> in 1651. The last of the three he wrote in Paris, where he had gone partly to escape the war at home.<\/p>\n<p>The theory of the person set out in chapter 16 of <em>Leviathan<\/em> begins from a difficulty. The state is said to be the seat of sovereignty, and the state is also said to be an artifice with no capacity to do anything at all. Quentin Skinner's reconstruction rests on a category he calls attributed action. An action performed by one agent may genuinely count as another's, provided that the performer has been authorised to act in the other's name. The one who performs is the actor, and the one who owns the words and the actions, and who has to answer for them, is the author (Skinner 2002: 183–184). The vocabulary comes from the playhouse rather than from theology, as Hobbes says himself: &quot;So that a Person, is the same that an Actor is, both on the Stage and in common Conversation; and to Personate, is to Act, or Represent himself, or an other&quot; (Hobbes, <em>Leviathan<\/em>, quoted in Hundert 2005: 144).<\/p>\n<p>'Person', in this vocabulary, is not another word for 'human being'. On Hobbes's definition a temple or a bridge counts as an artificial person, because the acts attributed to it are performed by others (Weithman 2019: 178). Banks, universities and governments act every day, and none of them has hands. Hobbes gives us the terms for saying whose action such an action is, and he leaves open the question that every institution acting in your name depends on: &quot;What, in a word, distinguishes representation from misrepresentation?&quot; (Skinner 2002: 182).<\/p>\n<p>That definition is what places Hobbes in the critical tradition. A state, a bank or a temple is addressed every day as an agent acting in its own right, and the theory of attributed action takes the appearance apart, showing the deeds of each to be performed by one party and owned by another. He belongs to the biological tradition for the limit that the argument works from, which is a bodily one. Only a creature with hands performs an action, and everything else that acts in the world acts through such creatures.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Hobbes, Thomas. 1651. <em>Leviathan<\/em>. London.<\/p>\n<p>Hundert, Edward J. 2005 [1994]. <em>Enlightenment's Fable: Bernard Mandeville and the Discovery of Society<\/em>. Cambridge: Cambridge University Press.<\/p>\n<p>Runciman, David. 2021. <em>Confronting Leviathan: A History of Ideas<\/em>. London: Profile Books, chapter 1, ‘Hobbes on the State’.<\/p>\n<p>Skinner, Quentin. 2002. ‘Hobbes and the Purely Artificial Person of the State’, in <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 177–208.<\/p>\n<p>Weithman, Paul. 2019. ‘Hobbes on Persons and Authorization’, in S. A. Lloyd (ed.), <em>Interpreting Hobbes's Political Philosophy<\/em>. Cambridge: Cambridge University Press, pp. 173–190.<\/p>\n<p>Wikipedia. &quot;Thomas Hobbes.&quot; Accessed 9 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"Westport, England","pod":"Ault Hucknall, England","tags":["biological","critical"],"image_sq":"author_photos/hobbes.png","image_circle":"author_photos/circles/hobbes.png","living":false,"y":17,"x":-12046579200000,"birth":-12046579200000,"death":-9153907200000,"birth_label":"05 Apr 1588","death_label":"04 Dec 1679"},{"id":"descartes","author":"René Descartes","author_long":"René Descartes","surname":"Descartes","initials":"RD","bio":"<div class='timeline-md'><p>René Descartes (1596–1650) was the fourth child of Jeanne Brochard, and his father Joachim was a lawyer in the provincial parliament at Rennes. At ten he was sent to a Jesuit boarding school, where his education, like the Cambridge education of Bacon, put him off desiccated Scholasticism for good. He studied law at Poitiers, grew dissatisfied with the world of books, and in 1618 went to Holland to join the army of Prince Maurice of Nassau as a volunteer, where he never fought and was never paid, using the time instead to work at mathematical problems and to write a treatise on music with a young doctor, Isaac Beeckman (Oakley 2000: 84).<\/p>\n<p>Cartesian philosophy was born in the cold winter of 1619–20, in a small room heated by a stove on the outskirts of Ulm, where he reviewed all his knowledge systematically, came to doubt even his own existence, and concluded that most of his education had not been about knowledge at all (Oakley 2000: 85). <em>Le Monde<\/em> was almost finished in 1633 when he learned that Galileo had been condemned for wanting to establish the movement of the earth, and he set it aside and worked instead on the <em>Philosophical Essays<\/em>, one part of which was the <em>Discourse on the Method<\/em>, published in 1637 with four rules of method taken to hold for all the sciences (Oakley 2000: 86).<\/p>\n<p>The dualism for which he is best known, and the associated claim that all living things have the quality of machines, are set out most fully in the <em>Meditations on First Philosophy<\/em> of 1641 and the <em>Principles of Philosophy<\/em> of 1644: human beings are made of two distinct substances, one thinking and one corporeal, thought is independent of the body, and the body is a machine, though a better one than any other because God made it (Oakley 2000: 87). Nadler describes the quarrel this provoked in the Dutch Republic, where the Cartesians argued that theologians should stay quiet wherever no article of faith is at stake and leave the philosophers and the scientists free to work (Nadler 2011: 48). Nisbet quotes the judgement of Tocqueville that in the seventeenth century Bacon in the natural sciences and Descartes in philosophy &quot;abolished received formulas, destroyed the empire of tradition, and overthrew the authority of the schools&quot; (Nisbet 2017: 276).<\/p>\n<p>Descartes belongs to the critical tradition because doubt is made the instrument of knowledge, so that nothing inherited is allowed to stand unexamined, and Tocqueville found that method of repudiating tradition being followed eagerly by Americans who had never heard the name of Descartes (Nisbet 2017: 129). He belongs to the biological tradition for the other half of the dualism, the body as mechanism, pressed as far as the claim that a full statement of the bodily machine would leave no more reason to attribute its involuntary movements to a soul than to suppose that a soul in a clock makes it tell the time (Oakley 2000: 87).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nadler, Steven. 2011. <em>A Book Forged in Hell: Spinoza's Scandalous Treatise and the Birth of the Secular Age<\/em>. Princeton: Princeton University Press, p. 48.<\/p>\n<p>Nisbet, Robert A. 2017. <em>The Sociological Tradition<\/em>. Abingdon: Routledge, pp. 129 and 276. First published in 1966.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, pp. 84–87.<\/p>\n<p>Wikipedia. &quot;René Descartes.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","pob":"La Haye-en-Touraine (Descartes), France","pod":"Stockholm, Sweden","tags":["critical","biological"],"image_sq":"author_photos/descartes.png","image_circle":"author_photos/circles/descartes.png","living":false,"y":18,"x":-11794550400000,"birth":-11794550400000,"death":-10094630400000,"birth_label":"31 Mar 1596","death_label":"11 Feb 1650"}],"type":"scatter","name":"Authors","showInLegend":false,"zIndex":10,"custom":{"isAuthor":true},"marker":{"enabled":false},"dataLabels":{"enabled":true,"useHTML":true,"allowOverlap":false,"crop":false,"overflow":"allow","align":"right","verticalAlign":"middle","x":-6,"y":0,"padding":0,"style":{"color":"#000","fontSize":"16px","fontWeight":"normal","textOutline":"none"},"formatter":"SocTime.authorLabelFormatter"},"point":{"events":{"mouseOver":"SocTime.authorMouseOver","mouseOut":"SocTime.authorMouseOut","click":"SocTime.authorClick"}},"tooltip":{"headerFormat":"","pointFormatter":"SocTime.authorTooltipFormatter"}},{"data":[{"author":"Marsilius of Padua","author_id":"marsilius","orig_title":"Defensor pacis","pub_date":"1324-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>Marsilius completed the <em>Defensor pacis<\/em> in 1324 and dedicated it to Ludwig of Bavaria; the manuscript survives corrected in the hand of Marsilius himself, which is unusual for a medieval text (Elden 2013: 194). Three discourses of very unequal length make it up, the first on the powers of what Marsilius calls the <em>regnum<\/em> or realm, the second and by far the longest on those of the church, and a short third that summarises the other two and proposes concrete measures against the dangers to peace (Elden 2013: 194). One theme binds them, the damage done to a peaceful and self-sufficient community by the interference of papal government in secular life (Nederman and Mulieri 2025: section 12).<\/p>\n<p>Coercive law belongs to the whole body of citizens and to nobody else, and canon law offers at best counsels to the faithful about deeds they may wish to perform or avoid for the sake of their souls. The church itself is defined as &quot;the whole body of the faithful who believe in and invoke the body of Christ&quot;, which makes the citizen body the supreme authority in the ecclesiastical realm as well as the secular one, with a General Council as the effective governing organ (Nederman and Mulieri 2025: section 12). Readers later charged with heresy claimed to have taken their ideas from the &quot;accursed Marsilius&quot;, and the editor of the Latin text called the work &quot;one of the many tedious polemics in the last weary contest of the medieval Empire and the Papacy&quot; (Elden 2013: 194).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, pp. 194–196 and 417.<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 12, 'Marsilius of Padua'.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Defender of the Peace (tr. Annabel Brett)","eng_date":"2005","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1324,"x":-20385820800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH 1","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>Pope John XXII dismantled the Franciscan doctrine of poverty over twelve years, in a series of bulls of which the key ones date from 1322 and 1323; <em>Cum inter nonnullos<\/em>, issued on 12 November 1323, declared it heretical to hold that Christ and the apostles had owned nothing (Elden 2013: 202). The <em>Opus nonaginta dierum<\/em> is the first substantial political work that Ockham produced in reply, and it carries the name of the ninety days because it was apparently completed in three months (Elden 2013: 203).<\/p>\n<p>Two hundred pages of it are given over to the question of eating bread without the bread being property. That exactness follows from the terms of the dispute, since the Franciscan position rested on the separation that the bull <em>Exiit qui seminat<\/em> of 1279 had drawn between the right to use a thing and the simple fact of using it, and John XXII had by 1324 refused the Franciscan Order the standing of anything more than a represented and imaginary person (Elden 2013: 202; Lambertini 2023: 80). Ockham was unusual among the friars in analysing the doctrines in the bulls themselves theologically, and the result has been described as a &quot;work of overwhelming erudition&quot; whose scope &quot;virtually precluded reply&quot; (Elden 2013: 203).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, pp. 202–203 and 424.<\/p>\n<p>Lambertini, Roberto. 2023. 'Enrico del Carretto: Why a Religious Order Is Not a Mere Collection of Individuals'. In Jenny Pelletier and Christian Rode (eds), <em>The Reality of the Social World: Medieval, Early Modern, and Contemporary Perspectives on Social Ontology<\/em>. Cham: Springer, pp. 79–91.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Work of Ninety Days","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_displa
