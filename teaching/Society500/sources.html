tjcC//nyg06Y/Ud6sp6wrqkwqntlZ/B1BX/mUF/j9daKBfBfW9GhhwaR71eYXNuGrqSzWTc3Eu9ZGFSXxn278BbCz7h/39f+LwnTeyqG/Tk/Tpb2u8bADcxL++jfoqPUta7/7aIVBKHbeb+hb92TLq/3ZSH2JwxT+0gvoCm0OPnu/0w/cFxhb9dugS6qtrPiVbVi9u3aZtu/YdOlIfrPXS2j87rtPzX7bQS0D+H2vI/kulMNHVAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":2,"tags":"critical"},{"author":"William of Ockham","author_id":"ockham","orig_title":"Dialogus","pub_date":"1341-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>The <em>Dialogus<\/em> is a long exchange between a Master and a Student, written in stages over many years, and it is the least settled of the political writings of Ockham. The first of its parts treats heresy and the third theological disputes, the second appears never to have been written, and no reliable printed edition of the Latin text exists, so that the standard modern text is an online critical edition (Elden 2013: 204, 424).<\/p>\n<p>On the origin of imperial jurisdiction the Master separates the papal office, which is ordained directly by God, from the emperor of the world, whose power comes by human assent alone. Whatever depends on the determinations of mankind &quot;can licitly be changed by men, because everything is dissolved by the same causes that gave it birth&quot; (Nederman and Mulieri 2025: section 13), which gives the Roman people the right to elect their own bishop, who happens to be the pope, and allows them to transfer that right to the emperor. The same reasoning opens a General Council to the laity, women included, since matters of the faith touch them as well.<\/p>\n<p>Empire, on this argument, has no claim to be the best arrangement available. &quot;It is not beneficial for the totality of mortals to be ruled by one monarch of the whole world&quot;, Ockham writes, since as a rule it is better ruled by several rulers, none of whom is superior to another (Elden 2013: 207). The dialogue form, a conversation between opposing points of view, makes it difficult to attribute any of these positions to Ockham himself (Elden 2013: 426).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, pp. 204, 207, 424 and 426.<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 13, 'William of Ockham'.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Dialogue","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1341,"x":-19849276800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB tes the rights of small political units against the church, while the <em>Defensor minor<\/em> has been read as advocating empire in place of a republic, and some readers infer from that reading that Marsilius had been an apologist for empire all along. Cary Nederman contests the foundation of both readings, holding that universal empire can be legitimate without that making it the best outcome, and that the later work is &quot;not primarily a work of imperial political theory at all&quot; (Elden 2013: 195). It was edited in English together with <em>De translatione imperii<\/em> by Nederman in 1993 (Elden 2013: 417).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, pp. 195–196 and 417.<\/p>\n<\/reference>\n<\/div>","eng_title":"Defensor Minor, in Writings on the Empire (ed. Cary J. Nederman)","eng_date":"1993","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1342,"x":-19817740800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHw <\/p>\n<p>Around 1337 Ockham had moved from the narrow question of heresy to papal authority at large, and the argument here belongs to that shift. The plenitude of power claimed for the papacy is limited, there are things a pope may legitimately do and things he may not, and a pope who becomes a heretic is deprived of his power altogether (Elden 2013: 205). What Ockham demands of his opponents he accepts for himself, and the prologue undertakes to withdraw if anyone can prove him mistaken &quot;by means of an argument or an authority which I am bound to accept; and if I have no reasonable answer to make, I shall confess that I have been in error&quot; (Elden 2013: 205).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, pp. 204–205 and 424–425.<\/p>\n<\/reference>\n<\/div>","eng_title":"On the Power of Emperors and Popes (tr. Annabel S. Brett)","eng_date":"1998","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1347,"x":-19659974400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwA ated the events of Arab-Muslim history without analysing the forces behind them (Dhaouadi 1990: 321-322).<\/p>\n<p>Holding the argument together is al-assabiyya, from the Arabic root meaning to bind, the group feeling that ties blood relatives and, by extension, allies and clients into a body able to act as one. It is strongest among the desert tribes and weakest in the cities, which is why dynasties founded by nomads conquer settled ones and then lose, within a few generations, the solidarity that carried them there (Dhaouadi 1990: 325). Ibn Khaldun described the work himself as a commentary &quot;on civilisations, on urbanisation, and on the essential characteristics of human social organisation, in a way that explains to the reader how and why things are as they are&quot; (Ibn Khaldun 1974, I: 3-9, quoted in Dhaouadi 1990: 324).<\/p>\n<p>It reached European readers late. The Arabic text was printed at Paris by Étienne-Marc Quatremère in 1858, de Slane translated it into French in 1863, and the first complete English translation, by Franz Rosenthal, appeared in 1958. Recognition inside sociology has been slower still, and Stéphane Dufoix counts two mentions of Ibn Khaldun in the thousand-page history of sociology assembled by Harry Elmer Barnes in 1948 (Dufoix 2022: 865).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Dhaouadi, Mahmoud. 1990. &quot;Ibn Khaldun: The Founding Father of Eastern Sociology&quot;. <em>International Sociology<\/em> 5(3): 319-335, pp. 321, 322, 324 and 325.<\/p>\n<p>Dufoix, Stéphane. 2022. &quot;A Larger Grain of Sense. Making Early Non-Western Sociological Thought Visible&quot;. <em>Sociedade e Estado<\/em> 37(3): 861-884, p. 865.<\/p>\n<p>Ibn Khaldun. 1974. <em>The Muqaddimah<\/em>, translated by Franz Rosenthal, edited and abridged by N. J. Dawood. Princeton: Princeton University Press.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Muqaddimah: An Introduction to History","eng_date":"1958","posthumous":"FALSE","coauthor":null,"link":null,"pub rgues for 1400 or 1401; Quentin Skinner treats the question as being of no great historical importance (Skinner 1978a: 73).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 73, 78 and 83. First published 1978.<\/p>\n<\/reference>\n<\/div>","eng_title":"A Eulogy of the City of Florence (tr. Hans Baron)","eng_date":"1968","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1404,"x":-17861299200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaONVnGmO+KtkmFg087X0RTJeTW4E57quWl1BbxZD8Ud0khsNs85b/K1qYlE5UbKyEHkGZWGU+50FeEHZ6zQRzJVDPVMwDA+g1JQVJAecsNqfpR9jPN6JLsSnSAmXzqgWu ature; Christine challenges it directly, holding that women of all estates have the capacities that the maintenance of earthly well-being demands (Nederman and Mulieri 2025: section 16).<\/p>\n<p>Brian Anslay translated the book into English as <em>The Boke of the Cyte of Ladyes<\/em>, printed by Henry Pepwell in 1521 for Richard Grey, third Earl of Kent, and that printing remained the only version published in French or English before the twentieth century.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 16, 'Christine de Pizan'.<\/p>\n<p>Wikipedia. &quot;The Book of the City of Ladies.&quot; Accessed 17 September 2026.<\/p>\n<p>Wikipedia. &quot;Brian Anslay.&quot; Accessed 17 September 2026.<\/p>\n<p>Iter Press. &quot;The Boke of the Cyte of Ladyes.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Boke of the Cyte of Ladyes (tr. Brian Anslay)","eng_date":"1521","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1405,"x":-17829676800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH rts divide it, the first on the education of the prince, the second on the conduct expected of knights and nobles, and the third on the lives of commoners (Nederman and Mulieri 2025: section 16).<\/p>\n<p>The organic image is taken from books 5 and 6 of the <em>Policraticus<\/em> of John of Salisbury, and Christine writes that &quot;just as the human body is not whole, but defective and deformed, when it lacks any of its members, so the body politic cannot be perfect, whole, or healthy if all the estates of which we speak are not well joined and united together&quot; (Nederman and Mulieri 2025: section 16). She then alters what she has taken. The clergy are no longer the soul of the body but one of three branches of the common people, and the king is the ordainer and regulator of all the estates, so that the church exercises no supremacy over the temporal sphere.<\/p>\n<p>The advice that follows is practical and often financial. Poorly compensated soldiers &quot;pillage and despoil the country&quot;, whereas well-paid troops buy what they need in it, royal taxation ought to be reasonable and to fall equitably on the wealthy and the poor, and the prince ought to hear the labourers and the merchants on how they make their profit (Nederman and Mulieri 2025: section 16).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nederman, Cary J., and Alessandro Mulieri. 2025. 'Medieval Political Philosophy'. <em>The Stanford Encyclopedia of Philosophy<\/em>, ed. Edward N. Zalta and Uri Nodelman, first published 10 January 2025, section 16, 'Christine de Pizan'.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Book of the Body Politic (tr. Kate Langdon Forhan)","eng_date":"1994","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1407,"x":-17766604800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHw RTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":4,"tags":["civic","utopian"]},{"author":"Leonardo Bruni","author_id":"bruni","orig_title":"Historiarum Florentini populi libri XII","pub_date":"1442-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>One idea organises the <em>Historiarum Florentini populi libri XII<\/em>, that a people achieves greatness for as long as there is freedom to take part in the business of government, and falls into corruption as soon as that liberty is taken away. The opening book surveys Italy from the origins of the Roman Republic to the campaigns against Frederick II in the middle of the thirteenth century, and explains the growth and collapse of Roman hegemony in those terms, since &quot;when the pathway to greatness is opened up, men raise themselves up with greater ease, whereas when it is closed off to them, they fall back into idleness&quot; (Skinner 1978a: 84).<\/p>\n<p>Composition ran across most of the working life of Bruni. Skinner dates the main writing to the years between 1414 and 1420 and Pocock places the first four books in the years from 1415 to 1421, while the twelve books were given official publication by the Florentine Signoria in 1442 (Skinner 1978a: 83; Pocock 2003: 87). The history registers a change in the city, the passage of Florence from a popular state to a mixed one once the many had ceased to bear arms in their own defence, so that the control of policy passed to the elite groups whose wealth and wisdom were held to fit them for it (Pocock 2003: 89–90). The work has been called the first modern history book, and Bruni was the earliest writer to divide the past into antiquity, a middle age and modern times.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Pocock, J. G. A. 2003. <em>The Machiavellian Moment: Florentine Political Thought and the Atlantic Republican Tradition<\/em>. Princeton: Princeton University Press, pp. 87 and 89–90. First published 1975.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 83–84. First published 1978.<\/p>\n<p>jameshankins.org. Note on the work by James Hankins. Accessed 17 September 2026.<\/p>\n<p>Wikipedia. &quot;Leonardo Bruni.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","eng_title":"History of the Florentine People","eng_date":"2001","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1442,"x":-16662067200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaONVnGmO+KtkmFg087X0RTJeTW4E57quWl1BbxZD8Ud0khsNs85b/K1qYlE5UbKyEHkGZWGU+50FeEHZ6zQRzJVDPVMwDA+g1JQV ok in 1509 at the house of Thomas More and had it first printed in Paris in June 1511 by Gilles de Gourmont, revising and extending it in later editions until 1532. Nisbet finds in Folly a personification of the humility, humour, wit and insight that Erasmus had drawn from the greatest of the Greek and Roman philosophers and the most imaginative of the classical poets, with Lucian in the forefront of those influences (Nisbet 1973: 197).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, p. 197.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, p. 29.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Praise of Folly (tr. Hoyt H. Hudson)","eng_date":"1941","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1511,"x":-14484700800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH ation for employment as well as a work of political theory (Skinner 2000: 25).<\/p>\n<p>The work circulated in manuscript for nearly twenty years, and no copy in the hand of Machiavelli survives. It was first printed in 1532, five years after his death, by Antonio Blado in Rome with the permission of the Medici pope Clement VII, and the dedication had by then passed from Giuliano de' Medici to Lorenzo de' Medici, Duke of Urbino. Around fifteen editions had appeared before the Index of Paul IV placed it on the list of prohibited works in 1559.<\/p>\n<p>Reginald Pole denounced Machiavelli by name in the <em>Apology to Charles V<\/em> of 1539 as destructive of all the virtues, and Roger Ascham wrote with similar revulsion of the doctrine that one may &quot;think, say and do whatever may serve best for profit and pleasure&quot; (Skinner 1978a: 250). The <em>Anti-Machiavel<\/em> of Innocent Gentillet was published at Geneva in 1576, and the customary term of abuse for a writer well practised in Machiavelli became the politic atheist (Skinner 1978a: 250).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, p. 250.<\/p>\n<p>Skinner, Quentin. 2000. <em>Machiavelli: A Very Short Introduction<\/em>. Oxford: Oxford University Press, pp. 25 and 89.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Prince","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1513,"x":-14421542400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwA  principis Christiani","pub_date":"1516-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>The <em>Institutio principis Christiani<\/em> was dedicated to Prince Charles of Habsburg, the future Charles V, and Erasmus wrote it in part to secure a place as his tutor. The place went elsewhere. He was appointed instead to teach Ferdinand, the brother of Charles, and made an honorary counsellor, while the book itself reached ten editions in his lifetime and was translated into several vernaculars.<\/p>\n<p>A prince is to be formed by an education that makes just and benevolent government possible and tyranny unlikely, and the obligations of a Christian ruler are treated as real duties rather than as a ceremony gone through once: &quot;Do not think that the profession of a Christian is a matter to be passed over lightly, entailing no responsibilities&quot;, Erasmus tells him (Nisbet 1973: 196). Skinner places the work in the northern humanist effort to remove any temptation to argue that the dictates of justice might be ignored in the hope of some greater benefit, and reads the answer it gives to Machiavelli as the deepest ethical divide between two writers working at the same moment within the same intellectual tradition (Skinner 1978a: 249–250).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, p. 196.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, pp. 249–250.<\/p>\n<p>Wikipedia. &quot;The Education of a Christian Prince.&quot; Accessed 17 September 2026.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Education of a Christian Prince (tr. Lester K. Born)","eng_date":"1936","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1516,"x":-14326934400000,"marker":{"symbol": ts beginning (Skinner 1978b: 3).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 3 and 12.<\/p>\n<\/reference>\n<\/div>","eng_title":"Ninety-Five Theses","eng_date":"1957","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1517,"x":-14295312000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaONVnGmO+KtkmFg087X0RTJeTW4E57quWl1BbxZD8Ud0khsNs85b/K1qYlE5UbKyEHkGZWGU+50FeEHZ6zQRzJVDPVMwDA+g1JQVJAecsNqfpR9jPN6JLsSnSAmXzqgWunBPSW9Xiv6QBe/2KczJ4De2ogtp ot; and acquire greatness only when &quot;the people are in control of them&quot; (Skinner 2000: 59). Since men always have the same desires and the same traits, whoever examines past events foresees future ones and can apply the remedies used by the ancients (Skinner 2000: 58).<\/p>\n<p>Francesco Guicciardini answered the praise of dissension in his <em>Considerations on the Discourses<\/em>, writing that &quot;to praise disunity is like praising a sick man's disease because of the virtues of the remedy applied to it&quot; (Skinner 2000: 75). The argument ran counter to the whole tradition of republican thought in Florence, in which discord had been outlawed as factious. The work was first printed in 1531, four years after the death of Machiavelli, with papal privilege.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2000. <em>Machiavelli: A Very Short Introduction<\/em>. Oxford: Oxford University Press, pp. 6, 56–59 and 75.<\/p>\n<\/reference>\n<\/div>","eng_title":"Discourses on the First Decade of Titus Livius","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1517,"x":-14295312000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO nd subject to no-one, and at the same time a perfectly dutiful servant of all things and subject to everyone, a contradiction posed in the vocabulary of feudal lordship and so undercutting the pomp of the church (Roper 2025: 24). Nisbet finds in the tract the point at which the early Luther comes closest to a revolutionary mentality, quoting its claim that &quot;we are all priests, and thus greater than mere kings&quot; (Nisbet 1973: 206), a doctrine that withdraws the standing of a separate religious class. The cover of the German edition carried the word Freiheit in large letters. Luther meant freedom in the religious sense, and Roper records that many peasants in the south-west, serfs owned by the monasteries and abbots he was attacking, took it to mean the ending of serfdom as well (Roper 2025: 12).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, p. 206.<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Freedom of a Christian","eng_date":"1957","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1520,"x":-14200704000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwA  the second chapter of Daniel, in which Daniel interprets the dream of Nebuchadnezzar, and preached it in the banqueting hall rather than the chapel. As Daniel had told the king that his empire would end, so Müntzer told the princes that the sword would be taken from them if they did not destroy the godless (Roper 2025: 136–137). The printed text, which came from the press Müntzer had opened at Allstedt (Roper 2025: 74), demands that the rulers hazard all for the sake of the gospel by mounting a crusade to wipe out the godless, and reaches that demand by reversing the sequence of the opening verses of the thirteenth chapter of the Epistle to the Romans, so that the apostolic command to obedience becomes a warrant for holy war (Skinner 1978b: 77). Skinner treats it as the most dramatic instance of genuine political revolution among the radical reformers, and records that Conrad Grebel and his Zurich followers wrote to Müntzer as soon as they learned its contents, admonishing him to cease from defending war (Skinner 1978b: 77–79).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 77–79.<\/p>\n<\/reference>\n<\/div>","eng_title":"Sermon before the Princes","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1524,"x":-14074473600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwA de","pub_date":"1524-01-01","orig_language":"<span class='lang-flag'>DE<\/span>","summary":"<div class='timeline-md'><p>Müntzer was in Nuremberg late in 1524 and had the pamphlet printed there by Hieronymus Höltzel, who had also printed a work of Karlstadt (Roper 2025: 100). It is his answer to Luther, and Skinner records that he devoted a special tract in these months to inveighing against &quot;the spiritless soft-living flesh in Wittenberg&quot; (Skinner 1978b: 79). The city had been chosen because it was a far larger printing centre than Allstedt, where an earlier reply to Luther had been attempted, and offered a far wider market; Hans Hut had brought that earlier tract to Nuremberg in September and had it printed by Hans Hergot, who had also printed the two attacks that Luther had made on Müntzer (Roper 2025: 100). When the council questioned that workshop in late October, the men who worked in it claimed that they had printed the tract without the knowledge of their master.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, p. 79.<\/p>\n<\/reference>\n<\/div>","eng_title":"Vindication and Refutation","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1524,"x":-14074473600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO "orig_language":"<span class='lang-flag'>DE<\/span>","summary":"<div class='timeline-md'><p>Luther wrote the tract in early May 1525, after a preaching tour of the Mansfeld mining region in which he was mocked and treated with sarcasm, and it was printed alongside the more measured <em>Admonition to Peace<\/em> of April, probably reaching the public in the second week of May (Roper 2025: 235). The argument stands squarely on the Pauline command that every person be subject to the governing authorities: since the peasants are deliberately and violently breaking that oath of obedience, all of them have abundantly merited death and have already forfeited body and soul (Skinner 1978b: 18). Roper counts six condemnations of the peasants as rebellious in the single paragraph that calls on the reader to &quot;smite, slay and stab&quot; them as though they were mad dogs, and notes that the pamphlet went so far as to proclaim the killing of peasants a godly work (Roper 2025: 235). Skinner rejects the defence that the tone was a momentary aberration under political pressure, reading the absolute duty of non-resistance as a direct outcome of the belief that the existing framework of social and political order reflects the will of God (Skinner 1978b: 18). The tract embarrassed even Luther's own supporters, among them Hermann Mühlpfort, mayor of Zwickau, who called it rash and to whom <em>The Freedom of a Christian<\/em> had been dedicated five years before (Roper 2025: 237).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Roper, Lyndal. 2025. <em>Summer of Fire and Blood: The German Peasants' War<\/em>. New York: Basic Books.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, p. 18.<\/p>\n<\/reference>\n<\/div>","eng_title":"Against the Robbing, Murdering Hordes of Peasants","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":152 kwqntlZ/B1BX/mUF/j9daKBfBfW9GhhwaR71eYXNuGrqSzWTc3Eu9ZGFSXxn278BbCz7h/39f+LwnTeyqG/Tk/Tpb2u8bADcxL++jfoqPUta7/7aIVBKHbeb+hb92TLq/3ZSH2JwxT+0gvoCm0OPnu/0w/cFxhb9dugS6qtrPiVbVi9u3aZtu/YdOlIfrPXS2j87rtPzX7bQS0D+H2vI/kulMNHVAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":11,"tags":"revolutionary"},{"author":"Niccolò Machiavelli","author_id":"machiavelli","orig_title":"Istorie fiorentine","pub_date":"1525-01-01","orig_language":"<span class='lang-flag'>IT<\/span>","summary":"<div class='timeline-md'><p>Machiavelli reached the Medicean court in March 1520 through Lorenzo Strozzi, a close friend who was related to Cardinal Giulio de' Medici, soon to be elected as Clement VII, and that November he was given a formal commission (Skinner 2000: 88). Writing the <em>Istorie fiorentine<\/em> occupied almost the rest of his life, and it is his longest and most leisured work, the one in which he follows the prescriptions of his favourite classical authorities with the greatest care (Skinner 2000: 88).<\/p>\n<p>Corruption is the overriding theme, and the narrative is organised by a distinction drawn in the preface between corruption in external policy and corruption at home, where it shows itself as civil strife (Skinner 2000: 93–94). Machiavelli criticises Bruni and Poggio for failing to attend to that danger in their histories (Skinner 2000: 95). He keeps the accepted format of humanist history, in which elaborate descriptions of notable battles were obligatory, while parodying its contents, so that the engagements described are ridiculous rather than glorious (Skinner 2000: 94).<\/p>\n<p>The last two books have to handle the rise of the Medici, whose patronage had made the writing possible, and the hostility in them is dissembled rather than absent. Cosimo is praised for surpassing every other man of his time in influence, wealth and liberality, and it shortly becomes clear that by his death no citizen of any standing in the city had been left without a large loan from him. By the years of Lorenzo the Magnificent, the fortune and the liberality of the Medici had so done their corrupting work, Machiavelli declares, that liberty was no longer known in Florence (Skinner 2000: 97).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2000. <em>Machiavelli: A Very Short Introduction<\/em>. Oxford: Oxford University Press, pp. 88–89 and 93–97.<\/p>\n<\/reference>\n<\/div>","eng_title":"The History of Florence","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1525,"x":-14042851200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaONVnGmO+KtkmFg087X0RTJeTW4E57quWl1BbxZD8Ud0khsNs85b/K1qYlE5UbKyEHkGZWG fty-eight maxims was printed at Paris in 1576, thirty-six years after the death of its author, under a title supplied by the editor rather than by Guicciardini.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Pocock, J. G. A. 2003. <em>The Machiavellian Moment: Florentine Political Thought and the Atlantic Republican Tradition<\/em>. Princeton: Princeton University Press, pp. 266–270.<\/p>\n<p>Skinner, Quentin. 1978a. <em>The Foundations of Modern Political Thought, Volume 1: The Renaissance<\/em>. Cambridge: Cambridge University Press, p. 169.<\/p>\n<\/reference>\n<\/div>","eng_title":"Maxims and Reflections of a Renaissance Statesman","eng_date":"1965","posthumous":"TRUE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1530,"x":-13885084800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42I ey inhabited, as Pufendorf and Vattel did after him, while denying any permanent right to exclude needy settlers: the Spaniards &quot;may import the commodities which they lack, and export the gold, silver and other things which they have in abundance&quot;, and local princes &quot;are obliged by natural law to love the Spaniards, and therefore cannot prohibit them without due cause from furthering their own interests&quot; (Ypi 2013: 9). He also entertains, for the sake of argument, the claim that the barbarians are &quot;so close to being mad, that they are unsuited to setting up or administering a commonwealth both legitimate and ordered in human and civil terms&quot;, which would license Spain to take over their administration (Ypi 2013: 11).<\/p>\n<p>Bartolomé de las Casas repeated the central contention at Valladolid in 1550, arguing against Sepúlveda that the Indians had built a genuine political society without revelation (Skinner 1978b: 170–171).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 169–171.<\/p>\n<p>Ypi, Lea. 2013. 'What's Wrong with Colonialism'. <em>Philosophy &amp; Public Affairs<\/em> 41(2):158–91.<\/p>\n<\/reference>\n<\/div>","eng_title":"On the American Indians (tr. Anthony Pagden and Jeremy Lawrance)","eng_date":"1991","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1539,"x":-13601088000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO nguage":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p><em>De iure belli<\/em> is the second of the pair of relections that Vitoria delivered as public lectures at Salamanca, and it takes up the law of war in relation to the conquests in the New World (Skinner 1978b: 169). The question had a named opponent. Juan Ginés de Sepúlveda, the leading champion of the Spanish colonists, held that the Indians, knowing nothing of the Christian faith, could not be living a life of genuine political liberty and human dignity, that their status was that of slaves by nature in the Aristotelian sense, and that the conquests were therefore an instance of a just war against infidels, the conquered being enslaved as an aid to converting them (Skinner 1978b: 142).<\/p>\n<p>Vitoria and the Thomists of Salamanca found that thesis difficult to oppose, since it rested on the <em>Politics<\/em> of Aristotle, an authority they held in the highest reverence. They were moved against it both by its heretical overtones, in the quasi-Lutheran contention that a genuine political society must be founded in godliness, and by the human consequences that had already followed from its being almost universally accepted in practice (Skinner 1978b: 142). The relection appeared with <em>De Indis<\/em> in the <em>Relectiones theologicae<\/em> at Lyon in 1557, eleven years after the death of Vitoria, and the two were edited together by Ernest Nys as <em>De Indis et de iure belli relectiones<\/em> for the Carnegie Institution of Washington in 1917 (Galli 2015: 168).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Galli, Carlo. 2015. <em>Janus's Gaze: Essays on Carl Schmitt<\/em>, trans. Amanda Minervini, ed. Adam Sitze. Durham, NC: Duke University Press, p. 168.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 142 and 169.<\/p>\n<\/reference>\n<\/div>","eng_title":"On the L h constitution as constitutionalist, since it binds the king by his coronation oath and gives the Parlement of Paris a right to veto proposed legislation, safeguards that the <em>Six Books<\/em> of a decade later withdraw (Skinner 1978b: 298–299).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 271, 291–292, 298 and 299. First published 1978.<\/p>\n<\/reference>\n<\/div>","eng_title":"Method for the Easy Comprehension of History","eng_date":"1945","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1566,"x":-12749011200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUD w becomes the power of &quot;giving laws to the subjects in general without their consent&quot; (Skinner 1978b: 289). Nisbet sets the classic definition of sovereignty, the most high, absolute and perpetual power over the subjects and citizens of a commonwealth (Nisbet 1973: 131), beside what the same book says of associations, that tyrants have always hated the corporations and communities of the people, and calls the author a transitional figure who could not reconcile the absolute state with the medieval society he still valued (Nisbet 1973: 134–135). Gabriel Harvey observed in the 1580s that the chances were ten to one of finding a scholar reading either Le Roy on Aristotle or the <em>Six Books<\/em> (Skinner 1978b: 300).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 131 and 134–135.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 284–285, 289 and 300. First published 1978.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Six Books of a Commonweal (tr. Richard Knolles)","eng_date":"1606","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1576,"x":-12433478400000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH e in the Parlement and withdrawn to his chateau, and it was as a stoic moralist that he won his first readers, hailed by Pasquier in 1587 as another Seneca in the French language (Skinner 1978b: 277). The earliest essays are the most conspicuously stoic in tone and in subject, and the posture of stoic endurance they cultivate came to seem an increasingly appealing response to what Montaigne described as the public death of a poor country amid the violence of its civil wars (Skinner 1978b: 277). Nisbet emphasises instead the cosmopolitan reach of the collection, which deals with the nature of culture, the types of social organisation, the effects of emotion on behaviour, the consequences of different forms of government and the place of birth, marriage and death in human societies, and traces to it a good deal of the later release of European thought from its own ethnocentrism (Nisbet 1973: 201). <em>Of Cannibals<\/em> and the <em>Apology for Raymond Sebond<\/em>, the two essays that bear most directly on the study of society, both belong to these first two books.<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, p. 201.<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 276–277.<\/p>\n<\/reference>\n<\/div>","eng_title":"Essays","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1580,"x":-12307248000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO "montaigne","orig_title":"Essais, livre troisième","pub_date":"1588-01-01","orig_language":"<span class='lang-flag'>FR<\/span>","summary":"<div class='timeline-md'><p>The third book was completed between 1585 and 1588, in the years in which its author had just finished two terms as mayor of Bordeaux and the religious wars were at their worst. Villey, working from the successive revisions in the Bordeaux copy, took it to embody the mature philosophy of nature, in which both stoicism and scepticism came to be treated as extreme positions (Skinner 1978b: 276). Skinner reports that later scholars have found the three-stage scheme excessively schematic, since in every phase of the writing the stoic elements are more freely criticised, and more closely intertwined with sceptical and epicurean beliefs, than the scheme allows (Skinner 1978b: 276). The essays were reissued in 1595 with a sonnet by Claude Expilly that hailed their author as a magnanimous stoic who defied the inconstancy and tempests of the age, and Justus Lipsius, whom Montaigne saluted in the later editions as the most learned man of the age, had by then made the same stoic vocabulary the basis of a political philosophy (Skinner 1978b: 277–278).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 1978b. <em>The Foundations of Modern Political Thought, Volume 2: The Age of Reformation<\/em>. Cambridge: Cambridge University Press, pp. 276–278.<\/p>\n<\/reference>\n<\/div>","eng_title":"Essays, third book","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1588,"x":-12054787200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH "grotius","orig_title":"Mare liberum","pub_date":"1609-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p><em>Mare liberum<\/em> began as one chapter of the <em>De Jure Praedae Commentarius<\/em>, the commentary on the law of prize and booty, and was issued separately (Elden 2013: 241). Its claim is that the sea should remain free and open to all, which set it directly against the maritime pretensions of Portugal and Spain in the East Indies and made it an intervention in a live dispute rather than an academic exercise. John Selden answered it with the <em>Mare Clausum<\/em>, drawing like Grotius on Bartolus and Baldus, and argued that states can enclose and claim oceans as they appropriate a territory or a field, wanting both dominium and imperium over them (Elden 2013: 241). Grotius himself came in time to recognise that although appropriation is inapplicable to the sea, some kind of enclosure remains possible, and <em>De jure belli ac pacis<\/em> concedes that imperium over a part of the sea is acquired as every other imperium is, in regard to persons and in regard to territory (Elden 2013: 241).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, p. 241.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Free Sea","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1609,"x":-11392012800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHw meline-md'><p>Organon is the Greek word for an instrument, and commonly for an instrument of reasoning, so the title announces a replacement for the logical works of Aristotle. The book was one part of the Great Instauration, the fresh start that was to take in the whole of human knowledge, and its method is systematic observation and experiment, proposed for every science and used to generate theory from facts rather than the reverse (Oakley 2000: 83). Its preface states the reason. The senses give evidence that has reference always to man and never to the universe, so that no excellence of wit and no repeated throws of the dice of experiment will do on their own, and the way from the first perceptions of the senses must be laid down on a sure plan (Oakley 2000: 83). Against that plan stand the idols, whose several kinds are classified over sixteen pages of the book, and Oakley reads the ridicule of Aristotelianism that runs through them as a sustained exposition of the sources of what would now be called bias (Oakley 2000: 82). Durkheim took the same idols as the starting point for the rule that social facts are to be treated as things, arguing that the preconceptions that Bacon had exposed in the physical sciences hold with still greater force in sociology (Durkheim 1982: 62).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Durkheim, Émile. 1982. <em>The Rules of Sociological Method<\/em>. New York: Free Press, p. 62.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, pp. 82–84.<\/p>\n<\/reference>\n<\/div>","eng_title":"Novum Organon, With Other Parts of The Great Instauration","eng_date":"1994","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1620,"x":-11044944000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO MNHVAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":15,"tags":["critical","utopian"]},{"author":"Hugo Grotius","author_id":"grotius","orig_title":"De iure belli ac pacis","pub_date":"1625-01-01","orig_language":"<span class='lang-flag'>LA<\/span>","summary":"<div class='timeline-md'><p>Begun in 1623 and published in 1625, the work asks first whether any war can be just, and answers that the principles of nature favour rather than forbid it, since the preservation of life and person is the end of war and all animals are endowed with the natural strength to defend themselves (Nisbet 1973: 66). Grotius then lists his authorities at length, running from the Greek and Roman philosophers through the early Christian fathers, and offers the law of nature, deducible by the right use of individual reason, as the warrant both for just warfare and for the necessary limits upon it (Nisbet 1973: 67). Nisbet reads those limits as an effort to restore the kind of limited war that had existed under the code of chivalry, and holds that something approximating to it had been achieved in Europe by the end of the century (Nisbet 1973: 68). They were in any case extremely wide, since it could be lawful on the terms of the book to kill a prisoner, to assassinate, to devastate lands and cities after a surrender and to treat civilians as though they were combatants. Elden, reading it for what it says about space rather than about war, finds its focus on imperium rather than jurisdiction, exercised primarily over persons and secondarily over the place called territory (Elden 2013: 240).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Elden, Stuart. 2013. <em>The Birth of Territory<\/em>. Chicago: University of Chicago Press, p. 240.<\/p>\n<p>Nisbet, Robert A. 1973. <em>The Social Philosophers: Community and Conflict in Western Thought<\/em>. New York: Thomas Y. Crowell, pp. 66–68.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Rights o  Y. Crowell, p. 351.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, p. 89.<\/p>\n<\/reference>\n<\/div>","eng_title":"","eng_date":null,"posthumous":"TRUE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1627,"x":-10824019200000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaONVnGmO+KtkmFg087X0RTJeTW4E57quWl1BbxZD8Ud0khsNs85b/K1qYlE5UbKyEHkGZWGU+50FeEHZ6zQRzJVDPVMwDA+g1JQVJAecsNqfpR9jPN6JLsSnSAmXzqgWunBPSW9Xiv6QBe/2KczJ4De2ogtpEPw3N9XSrerbcuaj1GvmeA4IewQMehlxklka0WKLylNpZbCk4s/PE5ocHN7fy60rqKoUuABvAAAAAFiS0dE/DwOo38AAAAJcEhZcwAAFRcAABUXAd4+cuMAAAAHdElNRQfqCgMAOzuutyMXAAATSklEQVR42u3de3hV1ZnH8ZMQ7gkkARMQiMEQSlKMEUNMlBIQL4EmSAzFQYoKERQLEW+gohIF ot;, which is to instruct men by the knowledge of past actions so that they bear themselves prudently in the present, and he &quot;least of all liked the democracy&quot;, having shown how a community that decides in large assemblies is ruined by the contention of demagogues for reputation and glory of wit (Skinner 2002: 54–55).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2002. <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 5, 44, 52–55 and 62–65.<\/p>\n<\/reference>\n<\/div>","eng_title":"","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1629,"x":-10760860800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOH////8Zsiz0AAAD7dFJOUwAGKE92nLG+zNnm9P3nl3xcGAI0stv8/sd4KixusO93CRvW42IKW7rUSxaH8aockfbNIpv5NwiB+PdY3ftCH+0jXdUNC5+zY+sOhIUDGhHEZgS2AaON ted (Oakley 2000: 86). The theist conformism of the book would have impressed many of the traditional philosophers it criticised, since it ranks the certainty of God with that of mathematics (Oakley 2000: 86). Nadler notes that it also held the most general laws of physics to have been instituted by God at the creation, an arrangement whose wisdom human beings cannot fully penetrate (Nadler 2011: 78).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Nadler, Steven. 2011. <em>A Book Forged in Hell: Spinoza's Scandalous Treatise and the Birth of the Secular Age<\/em>. Princeton: Princeton University Press, p. 78.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, p. 86.<\/p>\n<\/reference>\n<\/div>","eng_title":"Discourse on the Method of Rightly Conducting the Reason and Seeking Truth in the Sciences","eng_date":"1968","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1637,"x":-10508400000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHw had begun a few years before the war to seethe with questions about the right of sovereignty and the obligations of citizens to obedience (Skinner 2002: 56, 66). Skinner singles out the vehemence with which the treatise repudiates the rhetorical culture in which Hobbes had been brought up, and its governing assumption is that reason possesses an inherent power to persuade us of the truths it finds out, so that eloquence has no necessary place in a science of politics (Skinner 2002: 9, 12). On liberty the position is still the classical one that Leviathan would later demolish, since Hobbes grants here that &quot;noe man can partake of Liberty, but onely in a Popular Commonwealth&quot; (Skinner 2002: 14). The work reached print only in 1650, and in two parts, the epistemological sections in February as Humane Nature and the political sections three months later as De Corpore Politico (Skinner 2002: 303).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2002. <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 8, 9, 12, 14, 56, 66 and 303.<\/p>\n<\/reference>\n<\/div>","eng_title":"","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1640,"x":-10413792000000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO  to expose the reader to the apparent logic of the thought processes of the author, which had particular difficulty in holding anything outside themselves for certain (Oakley 2000: 86). Looking from a window at men passing in the street, the meditator allows that he would ordinarily say he was looking at men, and then asks what he has in fact before him other than &quot;hats and cloaks, which can cover ghosts or dummies who move only by means of springs&quot;, concluding that he judges them to be men by the sole power of judgement residing in his mind (Oakley 2000: 86–87). Oakley treats the book, with the <em>Principles of Philosophy<\/em> of 1644, as the fullest statement of the doctrine that human beings are made of two distinct substances and that the body is a machine, and adds that what came down to later centuries under the name of Cartesian dualism is in substantial part a mythology, since the actual claim was that mind and body are substantially united while their interaction remains rationally unintelligible (Oakley 2000: 94).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, pp. 86–87 and 94.<\/p>\n<\/reference>\n<\/div>","eng_title":"Meditations on First Philosophy","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1641,"x":-10382169600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwA ><p>Hobbes brought out the work at Paris in April 1642, his first task on reaching France, and the full title announces the place he intended for it as the third section of a philosophy whose first two sections were still unpublished; the delays grew so long that the two further editions issued at Amsterdam in 1647 appeared under the shorter and now familiar name (Skinner 2002: 9, 56). What the book does is complete the sketch of the <em>Elements of Law<\/em>, and it shares with that earlier text the purpose of overturning the central tenets of Renaissance civil science and replacing them with a conception founded on premisses that Hobbes took to be properly scientific (Skinner 2002: 9). The measure of what he thought he had achieved is the boast at the start of <em>De Corpore<\/em> that civil philosophy is a science &quot;no older . . . than my own book De Cive&quot; (Skinner 2002: 209). On liberty the work marks a step away from the <em>Elements<\/em>, since Aristotle is now criticised for following the custom of his time in confusing dominion with liberty (Skinner 2002: 227). It travelled further than anything else that Hobbes wrote on politics in his lifetime. Charles Cotton put it into English, Samuel Sorbière and François du Verdus into French, and Pufendorf discussed it at length, while an English version was issued in March 1651 as <em>Philosophicall Rudiments Concerning Government and Society<\/em> (Skinner 2002: 265, 303).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2002. <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 9, 56, 209, 227, 265 and 303.<\/p>\n<\/reference>\n<\/div>","eng_title":"Philosophicall Rudiments Concerning Government and Society","eng_date":"1651","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1642,"x":-10350633600000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAAC SH2JwxT+0gvoCm0OPnu/0w/cFxhb9dugS6qtrPiVbVi9u3aZtu/YdOlIfrPXS2j87rtPzX7bQS0D+H2vI/kulMNHVAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":17,"tags":["biological","critical"]},{"author":"René Descartes","author_id":"descartes","orig_title":"Les Passions de l'âme","pub_date":"1649-01-01","orig_language":"<span class='lang-flag'>FR<\/span>","summary":"<div class='timeline-md'><p>The treatise was written for Princess Elisabeth, who had asked its author to define the passions, and it comes from a philosopher otherwise notable for dismissing emotion as undesirable (Oakley 2000: 94). Hundert places it within a wider project. The <em>Discourse on the Method<\/em> had asserted a connection between medicine and morals and laid the foundations of a mechanist physiology whose relevance to moral philosophy was appreciated almost at once in France, and the <em>Passions<\/em> sketched that enterprise without ever developing it adequately (Hundert 2005: 39). What followed was taken up by others. The followers of Gassendi pursued a medical and physiological analysis of moral belief and motivation in earnest, and in the 1660s the brothers De la Court in Holland grafted a reading of the <em>Passions<\/em> onto a republican political theory founded on the harnessing of the passions, a line that runs on to Mandeville (Hundert 2005: 24, 39).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Hundert, E. J. 2005. <em>The Enlightenment's Fable: Bernard Mandeville and the Discovery of Society<\/em>. Cambridge: Cambridge University Press, pp. 24 and 39.<\/p>\n<p>Oakley, Ann. 2000. <em>Experiments in Knowing: Gender and Method in the Social Sciences<\/em>. Cambridge: Polity Press, p. 94.<\/p>\n<\/reference>\n<\/div>","eng_title":"The Passions of the Soul","eng_date":"1989","posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1649,"x":-10129708800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAA Tk/Tpb2u8bADcxL++jfoqPUta7/7aIVBKHbeb+hb92TLq/3ZSH2JwxT+0gvoCm0OPnu/0w/cFxhb9dugS6qtrPiVbVi9u3aZtu/YdOlIfrPXS2j87rtPzX7bQS0D+H2vI/kulMNHVAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAABJRU5ErkJggg==)","width":18,"height":18,"lineWidth":0},"y":18,"tags":["critical","biological"]},{"author":"Thomas Hobbes","author_id":"hobbes","orig_title":"Leviathan, or The Matter, Forme, & Power of a Common-wealth Ecclesiasticall and Civill","pub_date":"1651-01-01","orig_language":"<span class='lang-flag'>EN<\/span>","summary":"<div class='timeline-md'><p>Hobbes finished the book in the opening months of 1651 and it was published in London in late April or early May, the product of an outburst of work that took less than eighteen months and that interrupted the long labour on <em>De Corpore<\/em> (Skinner 2002: 11, 12, 19). Skinner reads that urgency as a response to the Oath of Engagement, imposed by Parliament in October 1649 on virtually the entire literate population, which required them to be &quot;true and faithful to the Commonwealth of England, as it is now established, without a King or House of Lords&quot; and so obliged defeated royalists to decide whether a government they took for a conquering power might lawfully be obeyed (Skinner 2002: 19). The book parts company with the <em>Elements of Law<\/em> and <em>De Cive<\/em> where civil science itself is defined, since the earlier versions held that reason persuades by its own power, while this one declares that &quot;the Sciences are small Power&quot; and that its findings must be supplemented and enforced by the rhetorical arts that those earlier works had set out to repudiate (Skinner 2002: 12, 80). The name of state is reserved for the artificial person brought into being when a multitude authorises a sovereign to bear its person, reversing the Renaissance habit of identifying a state with the body of its citizens (Skinner 2002: 13–14), and liberty is redefined so that a free man is one who &quot;is not hindred to doe what he has a will to&quot;, nothing counting as an impediment except an external obstruction to motion (Skinner 2002: 211–212).<\/p>\n<p>Runciman reads the same construction as a machine built to settle the question of who decides. Politics before Hobbes had asked people to choose whether their community belonged to its head or to its body, to the few or to the many, and the modern state is assembled so that the choice cannot arise, government and people remaining distinct yet locked together by authorisation, with the sovereign as merely the decider, so that it matters more that there should be one than who or what it is (Runciman 2021: ch. 1). The opening pages offer a mechanism rather than a creature, an &quot;Artificiall Man&quot; of greater stature and strength than the natural one, assembled out of human beings for the protection of those who built it (Runciman 2023: ch. 1).<\/p>\n<reference>\n<p>Sources:<\/p>\n<p>Skinner, Quentin. 2002. <em>Visions of Politics, Volume 3: Hobbes and Civil Science<\/em>. Cambridge: Cambridge University Press, pp. 11–15, 19, 80 and 211–212.<\/p>\n<p>Runciman, David. 2021. <em>Confronting Leviathan: A History of Ideas<\/em>. London: Profile Books, chapter 1, &quot;Hobbes on the State&quot;.<\/p>\n<p>Runciman, David. 2023. <em>The Handover: How We Gave Control of Our Lives to Corporations, States and AIs<\/em>. London: Profile Books, chapter 1, &quot;Superagents&quot;.<\/p>\n<\/reference>\n<\/div>","eng_title":"","eng_date":null,"posthumous":"FALSE","coauthor":null,"link":null,"pub_date_display":null,"pub_year":1651,"x":-10066636800000,"marker":{"symbol":"url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAL3UExURQAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAOHwAO
